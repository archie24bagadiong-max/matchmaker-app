<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Maker - JAMREIBIZ Badminton Club</title>
<!-- installable app on laptops (Chrome/Edge: Install) and iPhone/iPad (Safari: Add to Home Screen) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Match Maker">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load in the background: with no internet (hotspot only) the app no longer waits for them before showing -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --court:#0f3d2e; --court2:#145a42; --line:#e9f5ee; --lime:#c8f169;
  --bg:#f3f6f2; --card:#fff; --ink:#15211b; --muted:#66756d; --border:#dfe6e0;
  --A:#e4572e; --B:#e89b0c; --C:#25a065; --D:#3a7bd5;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px}
/* iPhone: no text enlarging in landscape; no pull-to-refresh reloading the app mid-session */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body{overscroll-behavior-y:none}
button{font:inherit;cursor:pointer;color:var(--ink)}
/* taps respond at once (no double-tap zoom wait) and long-press does not select text or pop the iOS menu */
button,.tapr,.chip,[data-act]{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input[type=search]{-webkit-appearance:none;appearance:none}
input,select,textarea{font:inherit;color:inherit}
header{background:var(--court);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
header h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px;letter-spacing:.5px;margin:0;flex:1;text-transform:uppercase}
header h1 span{color:var(--lime)}
header svg{flex:none}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:430px){header h1 em{font-size:10.5px;letter-spacing:1.5px} .sync span{display:none}}
header h1 em{display:block;font-style:normal;font-family:Barlow,sans-serif;font-size:12px;font-weight:700;letter-spacing:2.5px;color:#fff;opacity:.85;margin-top:2px;line-height:1.1}
.sync{font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.sync.ok i{background:var(--lime)}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 90px);max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;min-width:0;border:0;background:none;padding:10px 0 12px;color:var(--muted);font-weight:600;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--court2)}
nav button.on svg{stroke:var(--court2)}
h2{font-family:"Barlow Condensed",sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.4px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
h2 small{font-family:Barlow;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--court2);color:#fff;border-color:var(--court2)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--court)}
.btn.warn{color:#b3261e;border-color:#f0c9c6;background:#fff7f6}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45}
.cat{display:inline-flex;align-items:center;justify-content:center;min-width:26px;padding:0 3px;height:22px;border-radius:6px;color:#fff;font-weight:700;font-size:13px;flex:none}
.cA{background:var(--A)}.cB{background:var(--B)}.cC{background:var(--C)}.cD{background:var(--D)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{color:var(--ink);white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.chip.on{background:var(--court);color:#fff;border-color:var(--court)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed";font-size:24px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stat{border-top:4px solid var(--sc,var(--border))}
.stat b{color:var(--sc,var(--ink))}
.stat span{font-weight:600}
.stat.s-pr{--sc:#25a065;background:#e8f6ee;border-color:#bfe5cf}
.stat.s-pl{--sc:#0f3d2e;background:#dff0d0;border-color:#b8dca0}
.stat.s-wa{--sc:#c07a00;background:#fdf1dc;border-color:#f3d79f}
.stat.s-re{--sc:#3a7bd5;background:#e7effb;border-color:#c2d6f3}
.stat.s-gu{--sc:#7b4fbf;background:#f1ebfa;border-color:#d8c8f0}
.stat.lv-A{--sc:#e4572e;background:#fdebe5;border-color:#f6c6b7}
.stat.lv-B{--sc:#c07a00;background:#fdf1dc;border-color:#f3d79f}
.stat.lv-C{--sc:#1e8a56;background:#e6f5ed;border-color:#bfe5cf}
.stat.lv-D{--sc:#3a7bd5;background:#e7effb;border-color:#c2d6f3}

/* courts */
.courts{display:grid;gap:12px}
@media(min-width:720px){.courts{grid-template-columns:1fr 1fr}}
.courts.n1{grid-template-columns:1fr}
/* landscape: courts share the full width — 1 court fills it, 2 split it, 3 in thirds, 4 in quarters, more wrap */
@media(orientation:landscape) and (min-width:720px){
  main.wide{max-width:none}
  .courts.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .courts.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .courts.n5,.courts.n6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .courts.n7,.courts.n8{grid-template-columns:repeat(4,minmax(0,1fr))}
  .courts.n4 .court-f,.courts.n7 .court-f,.courts.n8 .court-f{flex-wrap:wrap}
  .courts.n4 .pl,.courts.n7 .pl,.courts.n8 .pl{flex-wrap:wrap;row-gap:3px}
  .courts.n4 .pl .nm,.courts.n7 .pl .nm,.courts.n8 .pl .nm{flex:1 1 55%}
  .courts.n4 .pl .gb,.courts.n7 .pl .gb,.courts.n8 .pl .gb{margin-left:auto}
  .courts.n4 .pitch,.courts.n7 .pitch,.courts.n8 .pitch{margin:0 8px}
  .courts.n4 .side,.courts.n7 .side,.courts.n8 .side{padding:6px 4px}
}
.court{background:var(--court);border-radius:var(--radius);color:#fff;overflow:hidden;cursor:pointer}
.court.cfin{box-shadow:0 0 0 3px #e5383b}
.cfin-tag{white-space:nowrap;flex:none;background:#e5383b;color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:8px;animation:gblink 1s steps(1,end) infinite}
.cmenu{margin-left:8px;font-size:22px;line-height:1;opacity:.8;padding:0 4px}
body.display .cmenu{display:none}
.devcard{background:var(--court);color:#fff;border-radius:var(--radius);padding:18px;text-align:center;margin:14px 0 6px}
.devk{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--lime)}
.devn{font-family:'Barlow Condensed';font-weight:800;font-size:24px;margin-top:4px}
.devnick{font-size:16px;opacity:.9;font-style:italic}
.devtel{display:inline-block;margin-top:10px;max-width:100%;overflow-wrap:anywhere;background:var(--lime);color:var(--court);font-weight:800;padding:8px 16px;border-radius:999px;text-decoration:none}
.devv{font-size:12px;opacity:.7;margin-top:10px}
.cmgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmgrid .btn{padding:14px 10px;font-size:16px}
.cmgrid .full{grid-column:1/-1}
.cmpl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmpl .pl{border:1px solid var(--line)}
.cmlv{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.cmlv button{min-width:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700}
.cmlv button.on{background:var(--court);color:#fff;border-color:var(--court)}
.court-h{display:flex;align-items:center;gap:8px;padding:10px 12px}
.court-h b{font-family:"Barlow Condensed";font-size:20px;text-transform:uppercase;letter-spacing:.5px}
.court-h .t{margin-left:auto;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.court-h b{white-space:nowrap}
.lv{display:flex;gap:4px;padding:0 12px 8px;align-items:center;font-size:12px;opacity:.95}
.lv button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:6px;width:28px;height:24px;font-weight:700;font-size:12px;padding:0}
.lv button.on{background:#fff;color:var(--court)}
.lv span{margin-right:4px;opacity:.75}
.pitch{margin:0 12px;border:2px solid var(--line);border-radius:6px;display:grid;grid-template-columns:minmax(0,1fr) 2px minmax(0,1fr);min-height:120px;background:var(--court2)}
.net{background:var(--line);opacity:.9}
.side{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:8px 6px;min-width:0}
.pl{background:rgba(255,255,255,.96);color:var(--ink);border:0;border-radius:10px;padding:7px 6px;display:flex;align-items:center;gap:5px;min-width:0;text-align:left;font-weight:600;font-size:15px;min-height:40px;width:100%}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .g{font-size:11px;color:var(--muted);font-weight:500;flex:none}
.pl .gb{font-size:9px;padding:1px 4px}
.pl.slot{background:transparent;color:#fff;border:2px dashed rgba(255,255,255,.55);justify-content:center;font-weight:600;font-size:14px}
.pl.slot .nm{flex:none;opacity:.9}
.pl.slot:active,.pl.slot:hover{background:rgba(255,255,255,.12)}
.pl.slotf{box-shadow:inset 0 0 0 2px var(--lime)}
.empty-court{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:14px;padding:20px;text-align:center}
.court-f{display:flex;gap:8px;padding:12px}
.court-f .btn{flex:1;padding:10px 8px}
.court-f .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:13px;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.item.sel .check{background:var(--court2);border-color:var(--court2)}
.item.sel .check:after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tapr{cursor:pointer;user-select:none}
.wait{display:flex;flex-wrap:wrap;gap:6px}
.wp{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px 10px 6px 6px;font-weight:600;font-size:14px}
.wp small{color:var(--muted);font-weight:500}
/* Next games (planned ahead) */
.nextg{display:flex;flex-direction:column;gap:8px}
.ng{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#fff}
.ng.first{border-color:var(--C);background:#f1faf4}
.ng-n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;min-width:62px}
.ng.first .ng-n{color:var(--C)}
.ng-t{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;min-width:220px}
.ng-s{display:flex;flex-wrap:nowrap;gap:6px}
@media (max-width:640px){.ng-t{order:3;flex-basis:100%;min-width:0}.ng-f{order:4}.ng-s{flex-wrap:wrap}}
.ng-vs{font-weight:700;color:var(--muted);font-size:13px;padding:0 2px}
.ng-hole{border:1px dashed var(--border);border-radius:10px;padding:6px 10px;color:var(--muted);font-size:13px}
.ng-a{display:flex;gap:6px;margin-left:auto}
.ng-f{width:100%;margin:0;font-size:13px}
.toast.act{pointer-events:auto}
.hsec{scroll-margin-top:84px}
.qbtn{flex:none;width:24px;height:24px;padding:0;border-radius:50%;border:1.5px solid var(--border);background:#fff;color:var(--muted);font:700 13px/1 Barlow,sans-serif;display:inline-flex;align-items:center;justify-content:center}
.qbtn:hover{border-color:var(--C);color:var(--C)}
body.display [data-act=help-topic]{pointer-events:auto;opacity:1}
/* drag a player onto another to swap them (court teams, planned games) */
[data-dd]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (hover:hover){[data-dd]{cursor:grab}}
.ddghost{position:fixed;z-index:200;pointer-events:none;opacity:.95;box-shadow:0 10px 28px rgba(0,0,0,.4);transform:scale(1.05);margin:0}
.ddsrc{opacity:.3}
.ddover{outline:3px solid var(--lime);outline-offset:2px}
.wp.ddover{outline-color:var(--C)}
html.dragging,html.dragging *{cursor:grabbing!important;user-select:none}
.toast .tbtn{margin-left:12px;background:var(--lime);color:var(--court);border:0;border-radius:8px;padding:5px 12px;font-weight:700;font-size:14px}
.wgrp{flex:0 0 100%;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--court2);margin:8px 2px 0;padding-bottom:4px;border-bottom:1px solid var(--border)}
.wgrp:first-child{margin-top:0}
/* waiting queue: a column per level */
.wq-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px 4px}
.wq-grid{display:grid;grid-template-columns:repeat(var(--n),minmax(124px,1fr));gap:6px;align-items:start}
.wq-col{display:flex;flex-direction:column;gap:5px;background:#f7faf8;border:1px solid var(--border);border-radius:12px;padding:6px;min-width:0}
.wq-h{display:flex;align-items:center;gap:6px;padding:2px 4px 4px;border-bottom:1px solid var(--border);margin-bottom:2px}
.wq-h small{color:var(--muted);font-weight:700;font-size:12px;margin-left:auto}
.wq-p{display:flex;align-items:center;gap:5px;width:100%;min-width:0;background:#fff;border:1px solid var(--border);border-radius:9px;padding:6px 7px;font-weight:600;font-size:14px;text-align:left}
.wq-p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wq-p .gb{font-size:9px;padding:1px 4px}
.wq-p .wq-i{font-weight:500;color:var(--muted)}
.wq-p .wq-i b{font-weight:700}
.wq-p small{flex:none;color:var(--muted);font-weight:600;font-size:12px}
.wq-p.z{border-color:#cfe7a6;background:#fbfff3}
.wq-p.z small{color:#3d6b00}
.wq-gst{background:#fff9ec;border-color:#f0d49a}
.wq-gst .wq-h .gb{font-size:12px;padding:2px 8px}
.wq-gst .wq-p .cat{min-width:24px;height:20px;font-size:11px}
.wgrp small{font-family:Barlow,sans-serif;font-weight:600;color:var(--muted);font-size:12px;margin-left:4px}
.wp.rest{border-style:dashed}
input[type=text],input[type=search],select,textarea{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
textarea{min-height:140px;resize:vertical}
select.mini{width:auto;padding:6px 8px;border-radius:8px}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0;line-height:1.4}
.seg{display:flex;background:#e6ece7;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.set{display:flex;flex-direction:column;gap:14px}
.set label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-family:"Barlow Condensed";font-size:24px;min-width:26px;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,25,18,.45);z-index:50;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:60;max-height:82vh;overflow:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .22s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#d5ddd7;margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.toast{z-index:100 !important;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.gb{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#fff1d6;color:#8a5a00;border:1px solid #f0d49a;border-radius:5px;padding:1px 5px;line-height:1.4;flex:none}
.gb.sb{background:#e3eefb;color:#1f4f8f;border-color:#bcd3f0}
.gb.fm{background:#e6f6ec;color:#1e6b43;border-color:#b9e2c9}
.gb.mg{background:#f3e8ff;color:#6b21a8;border-color:#dcc4f5}
.gnd{flex:none;font-weight:800;font-size:14px;line-height:1}
.gnd.gM{color:#2f6fc0}.gnd.gF{color:#c0397a}
.stb{flex:none;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:#eef1ef;color:#55635b;border:1px solid var(--border);white-space:nowrap}
.stb.off{background:#fdeceb;color:#a3261e;border-color:#f0c9c6}
.item.off .nm{opacity:.55}
.typeb.f{background:#e6f6ec;border-color:#b9e2c9;color:#1e6b43}
.typeb{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;min-width:44px}
.typeb.g{background:#fff1d6;border-color:#f0d49a;color:#8a5a00}
.typeb.mg{background:#f3e8ff;border-color:#dcc4f5;color:#6b21a8}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl .nmc{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:0}
.pinfo{flex:1;min-width:0}
.pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pnote{font-size:12px;color:var(--muted);margin-top:2px}
.phead{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 0;border-bottom:2px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

<script>
(function(){
/* 8 levels, strongest first. Courts filter by letter group (A covers A+ and A-). */
const CATS=['A+','A-','B+','B-','C+','C-','D+','D-'];
const GROUPS=['A','B','C','D'];
const RATE={'A+':8,'A-':7,'B+':6,'B-':5,'C+':4,'C-':3,'D+':2,'D-':1};
const DEF_LV='C+';
const grp=c=>String(c||'')[0];
const lvCmp=(a,b)=>(RATE[b]||0)-(RATE[a]||0);
const onLv=(c,p)=>c.lv.includes(grp(p.c));
/* old A/B/C/D data becomes A+/B+/C+/D+ */
const normLv=c=>CATS.includes(c)?c:(GROUPS.includes(c)?c+'+':DEF_LV);
/* player type: S = Subscriber, F = Family (own Family fee), MG = Member Guest, G = Non-Member Guest.
   Fee = type fee (Subscriber 0, Family S.fee.fm, Member Guest S.fee.mg, Non-Member Guest S.fee.gp) + shuttles (games played × S.fee.sp).
   Member Guests rank with Subscribers on courts; only Non-Member Guests get guest priority and the guests' queue column.
   status (club roster "Active" column): Reg, A-SUB, No (= inactive, hidden from Attendance). Gender: M / F. */
const STATUS=['Reg','A-SUB','Member-Guest','Non-Member','No'];
const STATUS_L={Reg:'Reg','A-SUB':'Member-SUB (A-SUB)','Member-Guest':'Member-Guest','Non-Member':'Non-Member',No:'No (inactive)'};
/* member status ↔ payment term: Member-SUB pays as a Subscriber, Member-Guest as a Member Guest, Non-Member as a Non-Member Guest */
const STATUS_TYPE={'A-SUB':'S','Member-Guest':'MG','Non-Member':'G'};
const TYPE_STATUS={S:'A-SUB',MG:'Member-Guest',G:'Non-Member'};
/* ---- money: part payments and balances (see Payments) ---- */
const r2=v=>Math.round(v*100)/100;
const partSum=id=>{ const x=S.part&&S.part[id]; return x?(+x.cash||0)+(+x.stc||0):0; };
const paidAmt=p=>{ const f=r2(fee(p)); return S.paid[p.id]?f:Math.min(f,r2(partSum(p.id))); };
/* Queuing Master (Settings → Fees): plays free — the bill still shows (report: "Queuing Master" line, taken off the Total) but is never owed */
const isQM=p=>!!(p&&S.qm&&p.id===S.qm);
const leftAmt=p=>isQM(p)?0:Math.max(0,r2(r2(fee(p))-paidAmt(p)));
const paidBy=(p,m)=>{ const x=(S.part&&S.part[p.id])||{}, ps=partSum(p.id); return r2((+x[m]||0)+(payM(p.id)===m?Math.max(0,r2(fee(p))-ps):0)); };
const pmText=(c,st)=>[c>0?'Cash':'',st>0?'STC Pay':''].filter(Boolean).join(' + ');
const rowPaid=r=>r.pa!=null?+r.pa:(r.pd?+r.f:0);
const rowLeft=r=>r.wv?0:Math.max(0,r2(+r.f-rowPaid(r)));
const rowCash=r=>r.pc!=null?+r.pc:(r.pd&&r.pm!=='STC Pay'?+r.f:0);
const rowStc=r=>r.ps!=null?+r.ps:(r.pd&&r.pm==='STC Pay'?+r.f:0);
/* keep every unpaid bill; trim only old fully paid rows */
function ledgerTrim(L){ if(L.length<=4000) return L; const open=L.filter(r=>rowLeft(r)>0.009), done=L.filter(r=>rowLeft(r)<=0.009); return done.slice(-Math.max(0,4000-open.length)).concat(open).sort((a,b)=>(a.ss||0)-(b.ss||0)); }
const keyT=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,(m||1)-1,d||1).getTime();};
/* unpaid bills from earlier sessions, oldest first */
let BILLS_IX=null;   // set only while vPay() draws: ledger rows grouped by player id / name
function billsIndex(){ const m=new Map(); S.ledger.forEach((r,i)=>{ const k=r.id?'i'+r.id:'n'+r.n; let l=m.get(k); if(!l) m.set(k,l=[]); l.push([i,r]); }); return m; }
function bills(p){ let src; if(BILLS_IX){ const a=BILLS_IX.get('i'+p.id)||[], b=BILLS_IX.get('n'+p.n)||[]; src=(b.length?a.concat(b).sort((x,y)=>x[0]-y[0]):a).map(x=>x[1]); } else src=S.ledger.filter(r=>r.id?r.id===p.id:r.n===p.n);
  return src.filter(r=>rowLeft(r)>0.009).sort((a,b)=>keyT(a.day)-keyT(b.day)||(a.ss||0)-(b.ss||0)); }
const balOf=p=>r2(bills(p).reduce((a,r)=>a+rowLeft(r),0));
/* date/time formatters made once: toLocale…String(options) builds a new formatter on every call, which made long
   History / Payments lists slow to draw */
const DTF=(()=>{ const mk=o=>{ try{ const f=new Intl.DateTimeFormat(undefined,o); return d=>f.format(d); }catch(e){ return null; } };
  return { day:mk({weekday:'short',day:'numeric',month:'short',year:'numeric'}), time:mk({hour:'numeric',minute:'2-digit'}) }; })();
const fmtDate=d=>DTF.day?DTF.day(d):d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtBill=k=>fmtDate(new Date(keyT(k)));
/* playing days (schedule): p.dy = ['Mon','Thu',…]; Settings → Show day filters Attendance and Players */
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], DAY_L={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
const normDays=a=>Array.isArray(a)?DAYS.filter(d=>a.includes(d)):[];
const DAY_W=/^(mon(day)?|tues?(day)?|wed(nesday)?|weds|thu(rs?(day)?)?|fri(day)?|sat(urday)?|sun(day)?)$/;
/* a cell / bulk part made only of day words: "Mon", "Monday & Thursday", "Mon-Fri", "Weekend", "Daily" */
const isDaysText=v=>{ const t=String(v||'').toLowerCase().trim(); if(!t) return false;
  if(/^(every\s*day|daily|week\s*days?|week\s*ends?)$/.test(t)) return true;
  const w=t.split(/[\s,;\/&+\-–—.]+|\band\b|\bto\b|\buntil\b|\btill\b/).filter(Boolean); return w.length>0&&w.every(x=>DAY_W.test(x)||/^(week\s*days?|week\s*ends?|and|to|until|till)$/.test(x)); };
function parseDays(v){
  let t=String(v==null?'':v).toLowerCase().trim(); if(!t) return [];
  if(/every\s*day|daily|^all(\s*days)?$/.test(t)) return DAYS.slice();
  const out=new Set(), ix=w=>DAY_W.test(w)?DAYS.findIndex(d=>d.toLowerCase()===w.slice(0,3)):-1;
  if(/week\s*days?/.test(t)) DAYS.slice(0,5).forEach(d=>out.add(d));
  if(/week\s*ends?/.test(t)) ['Sat','Sun'].forEach(d=>out.add(d));
  t=t.replace(/week\s*(days?|ends?)/g,' ');
  t=t.replace(/([a-z]+)\s*(?:-|–|—|to|until|till)\s*([a-z]+)/g,(m,a,b)=>{ const i=ix(a), j=ix(b); if(i<0||j<0) return m; for(let k=i;;k=(k+1)%7){ out.add(DAYS[k]); if(k===j) break; } return ' '; });
  t.split(/[^a-z]+/).forEach(w=>{ const i=ix(w); if(i>=0) out.add(DAYS[i]);
    else if(/^(th|tu|sa|su|m|t|w|f)+$/.test(w)) w.match(/th|tu|sa|su|m|t|w|f/g).forEach(c=>out.add({m:'Mon',t:'Tue',tu:'Tue',w:'Wed',th:'Thu',f:'Fri',sa:'Sat',su:'Sun'}[c])); });
  return DAYS.filter(d=>out.has(d));
}

  s.courts=s.courts.map(c=>{ let lv=Array.isArray(c&&c.lv)?[...new Set(c.lv.map(grp))].filter(x=>GROUPS.includes(x)).sort():[]; if(!lv.length) lv=GROUPS.slice(); return {lv,p:Array.isArray(c&&c.p)?c.p.map(String):[],t:+(c&&c.t)||0,sc:(c&&c.sc&&typeof c.sc==='object'&&c.sc.pos)?c.sc:null,d:Array.isArray(c&&c.d)?c.d.slice(0,4).map(x=>typeof x==='string'&&x?x:null):[],tm:typeof(c&&c.tm)==='string'?c.tm:''}; });

let dbRef=null, writing=false, dirty=false, saveTimer=null, lastTs=0;
function setSync(ok,label){const el=document.getElementById('sync');el.className='sync'+(ok?' ok':'');el.querySelector('span').textContent=label;}
/* Saving: quick taps (scoring, ticking attendance) are written together a moment later, so the whole session
   (history, ledger…) is turned into text once instead of on every tap. Court tablets still send scores at once.
   persistNow() runs when the app is hidden/closed and before any reload, so nothing is lost. */
let persistTimer=null;
function persistNow(){
  if(IS_POP){ clearTimeout(persistTimer); persistTimer=null; return; }
  clearTimeout(persistTimer); persistTimer=null;
  let txt; try{ txt=JSON.stringify(S); }catch(e){ return; }
  try{localStorage.setItem(LS_KEY,txt);}catch(e){}
  if(ROLE==='main'&&CAN_SYNC){ try{ AndroidApp.setShared(txt); }catch(e){} }
  if(typeof rtcBroadcast==='function') rtcBroadcast();   // phones scoring by QR get every change
}
function persistFlush(){ if(persistTimer) persistNow(); }
/* ask the browser to keep this site's data (never auto-cleared when the device is low on space) and measure what is used */
let STG={persist:null,mb:null};
async function storageCheck(ask){
  try{ if(navigator.storage){
    if(navigator.storage.persisted) STG.persist=await navigator.storage.persisted();
    if(ask&&!STG.persist&&navigator.storage.persist) STG.persist=await navigator.storage.persist();
    if(navigator.storage.estimate){ const e=await navigator.storage.estimate(); STG.mb=e&&e.usage?Math.round(e.usage/1e5)/10:null; } } }catch(e){}
  if(tab==='settings') render();
}
if(!IS_APP) setTimeout(()=>storageCheck(true),1500);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') persistFlush(); });

async function flush(){
  if(!dbRef||writing||!dirty) return;
  writing=true; dirty=false; lastTs=Date.now();
  try{ await dbRef.set({state:JSON.stringify(S),client:CLIENT,ts:lastTs}); setSync(true,'Synced'); }
  catch(e){ if(e&&e.code==='invalid_argument'){setSync(false,'View only');} else {setSync(false,'Offline'); dirty=true;} }
  writing=false;
  if(dirty) saveTimer=setTimeout(flush,800);
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const db=await window.claude.use('db');
    if(!db) return;
    dbRef=db.doc('club/state');
    photoDb=db;
    try{ db.collection('photos').onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ const x=d.data(); if(x&&typeof x.u==='string') m[d.id]=x.u; }); PH=m; try{localStorage.setItem(PH_KEY,JSON.stringify(PH));}catch(e){} render(); },()=>{}); }catch(e){}
    setSync(false,'Connecting…');
    let first=true;
    const to=setTimeout(()=>setSync(false,'Offline'),10000);
    dbRef.onSnapshot(snap=>{
      if(!snap.metadata.fromCache) clearTimeout(to);
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.exists){
        if(first&&S.players.length){ dirty=true; flush(); }
        first=false; if(!snap.metadata.fromCache) setSync(true,'Synced'); return;
      }
      const d=snap.data();
      first=false;
      if(!snap.metadata.fromCache) setSync(true,'Synced');
      if(d.client===CLIENT && d.ts<=lastTs) return;
      if(dirty||writing) return;
      try{ S=normalize(JSON.parse(d.state)); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} render(); }catch(e){}
    },err=>{clearTimeout(to);setSync(false,'Local');});
  }catch(e){}
})();

function prioritySort(list){

function ting(){

      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.65); });
  }catch(e){}
}

/* ---------- scoring (BWF: 21 pts, win by 2, cap 30, best of 3) ---------- */
const capFor=p=>p===21?30:p===15?21:p===11?15:p+9;

const needWins=r=>Math.floor(r.n/2)+1;

let scoreOpen=null, scoreDeferred=false, teamPick=null;

document.addEventListener('focusout',e=>{ if(e.target.tagName==='INPUT'&&((e.target.classList&&e.target.classList.contains('stsel'))||e.target.id==='tp-in')) setTimeout(()=>{ if(scoreDeferred){ scoreDeferred=false; renderScore(); } },60); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='tp-in'){ e.preventDefault(); const b=document.querySelector('[data-act=sc-tuse]'); b&&b.click(); } });
function scEnsure(i){
  const c=S.courts[i]; if(!c||!c.p.length) return null;
  if(!c.sc){ const half=c.p.length/2, A=c.p.slice(0,half), B=c.p.slice(half); c.sc={r:curRules(),g:[],a:0,b:0,srv:'',pos:{a:A,b:B},tn:{a:commonTeam(A),b:commonTeam(B)},undo:[],done:''}; }

const scTN=(sc,t)=>sc&&sc.tn&&typeof sc.tn[t]==='string'?sc.tn[t]:(sc?commonTeam(sc.pos[t]):'');
const scWho=(sc,t)=>{ const tn=scTN(sc,t), nm=scTeam(sc,t); return tn?tn+' ('+nm+')':nm; };
const scTeam=(sc,t)=>sc.pos[t].map(id=>(byId(id)||{}).n||'?').join(' & ');

function scServerId(sc){ if(!sc.srv) return ''; const pos=sc.pos[sc.srv]; return pos.length>1?pos[sc[sc.srv]%2]:pos[0]; }
function scReceiverId(sc){ if(!sc.srv) return ''; const o=sc.srv==='a'?'b':'a', pos=sc.pos[o]; return pos.length>1?pos[sc[sc.srv]%2]:pos[0]; }

  else sc.srv=t;                                                                   // receiving side wins: they serve next

function scDecider(i){ const sc=scEnsure(i); if(!sc||!sc.done||!sc.tie||sc.dec) return; scPush(sc); sc.seq=(sc.seq||0)+1; const last=sc.g[sc.g.length-1]; sc.dec=true; sc.tie=false; sc.done=''; sc.a=0; sc.b=0; sc.srv=last&&last[0]>last[1]?'a':'b'; sc.flip=!sc.flip; save(); renderScore(); flash('Decider game to '+DEC_PTS+' — teams change ends ⇄'); }
function scUndo(i){ const sc=S.courts[i]&&S.courts[i].sc; if(!sc||!sc.undo.length){ toast('Nothing to undo'); return; } const s=JSON.parse(sc.undo.pop()); const seq=(sc.seq||0)+1; Object.assign(sc,s); sc.seq=seq; save(); renderScore(); }
function scServe(i,t){ const sc=scEnsure(i); if(!sc||sc.a||sc.b||sc.g.length) return; sc.srv=t; sc.seq=(sc.seq||0)+1; save(); renderScore(); }
function scPick(i,t,id){

function scSwap(i,t){ const sc=scEnsure(i); if(!sc||sc.a||sc.b||sc.pos[t].length<2) return; sc.pos[t]=[sc.pos[t][1],sc.pos[t][0]]; sc.seq=(sc.seq||0)+1; save(); renderScore(); }

/* shrink the scoreboard step by step until the score boxes have room */
function fitScore(){
  const v=document.getElementById('scorev'); if(!v||v.hidden) return;
  v.classList.remove('cmp','cmp2');
  const small=()=>{ const b=v.querySelector('.spt'); if(!b) return false; const h=b.getBoundingClientRect().height, sb=v.querySelector('.sboard'); return h<Math.max(110,window.innerHeight*0.22)||(sb&&sb.scrollHeight>sb.clientHeight+2); };
  if(small()){ v.classList.add('cmp'); if(small()) v.classList.add('cmp2'); }
  eqChips(v);
}
/* every player box on the court gets the width of the widest one (longest name) */
function eqChips(v){
  const cs=[...v.querySelectorAll('.spt .spl')]; if(!cs.length) return;
  cs.forEach(c=>c.style.width='');
  const w=Math.max(...cs.map(c=>c.getBoundingClientRect().width));
  cs.forEach(c=>c.style.width=Math.ceil(w)+'px');
}

async function exportReport(){

    if(typeof window.AndroidApp.saveFile!=='function'){ toast('Install the latest MatchMaker.apk to export'); return; }
    window.AndroidApp.saveFile(b64,name); return;
  }
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;

/* web / laptop / iPhone: iPhone opens the Share sheet (Save to Files, WhatsApp…); laptops download the file */
async function browserSave(bytes,name,type){
  const file=new File([bytes],name,{type});
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; }
  const url=URL.createObjectURL(file), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Report saved to Downloads');
}

/* sort for the player lists in the sheets. Always: not played first, then played 1, 2, 3… at the bottom.
   Inside each group: Played (earliest finished first), Level (A+ … D-) or Guest (non-member guests, member guests, family, then subscribers); then name.
   Remembered on this device. */
const SH_SORTS={games:'not played first, then 1, 2, 3…',level:'not played first · by level, A+ first',guest:'not played first · guests, member guests, family, subscribers'};
let shSort='games'; try{ shSort=localStorage.getItem('mm_sh_sort')||'games'; }catch(e){}
if(!SH_SORTS[shSort]) shSort='games';
let shReopen=null;
function byGames(a,b){ return ((S.games[a.id]||0)-(S.games[b.id]||0))||((S.lastEnd[a.id]||0)-(S.lastEnd[b.id]||0)); }
function shSorted(arr){
  const lv=p=>{ const i=CATS.indexOf(p.c); return i<0?99:i; }, nm=(a,b)=>a.n.localeCompare(b.n);
  const ty=p=>p.t==='G'?0:p.t==='MG'?1:p.t==='F'?2:3;
  const gm=(a,b)=>(S.games[a.id]||0)-(S.games[b.id]||0);
  const f=shSort==='level'?((a,b)=>gm(a,b)||lv(a)-lv(b)||byGames(a,b)||nm(a,b))
        :shSort==='guest'?((a,b)=>gm(a,b)||ty(a)-ty(b)||lv(a)-lv(b)||byGames(a,b)||nm(a,b))
        :((a,b)=>byGames(a,b)||nm(a,b));
  return arr.slice().sort(f);

/* ---------- drag to rearrange teams ----------
   Mouse: drag a player onto another. Touch: press and hold a moment, then drag (a quick swipe still scrolls,
   a tap still opens the player). Dropping swaps the two — across the net that changes the teams. */
let dnd=null, dndBlock=0;
function dndStart(){
  const r=dnd.el.getBoundingClientRect(), gh=dnd.el.cloneNode(true);
  gh.classList.add('ddghost'); gh.style.width=r.width+'px'; gh.style.left=r.left+'px'; gh.style.top=r.top+'px';
  document.body.appendChild(gh); dnd.gh=gh; dnd.ox=dnd.x-r.left; dnd.oy=dnd.y-r.top; dnd.on=true;
  dnd.el.classList.add('ddsrc'); document.documentElement.classList.add('dragging');
  try{ if(dnd.touch&&navigator.vibrate) navigator.vibrate(25); }catch(e){}
}
function dndEnd(){ if(!dnd) return; clearTimeout(dnd.timer); if(dnd.gh) dnd.gh.remove(); dnd.el.classList.remove('ddsrc');
  document.querySelectorAll('.ddover').forEach(x=>x.classList.remove('ddover')); document.documentElement.classList.remove('dragging'); dnd=null; }
function dndTarget(x,y){
  dnd.gh.style.display='none'; const el=document.elementFromPoint(x,y); dnd.gh.style.display='';
  const t=el&&el.closest('[data-dd]'); return t&&t.dataset.id!==dnd.id&&t.dataset.dd===dnd.g?t:null;
}
function dndSwap(grpKey,a,b){
  const [kind,n]=grpKey.split(':'), i=+n;
  if(kind==='c'){
    const c=S.courts[i]; if(!c) return; const ia=c.p.indexOf(a), ib=c.p.indexOf(b); if(ia<0||ib<0) return;
    const sc=c.sc; if(sc&&(sc.a||sc.b||(sc.g&&sc.g.length))){ toast("Scoring has started — teams can't change now (reset the score first)"); return; }
    c.p[ia]=b; c.p[ib]=a;
    if(sc){ const seq=sc.seq||0; c.sc=null; scEnsure(i).seq=seq+1; }   // scoreboard not started yet: rebuild it with the new teams
    const half=c.p.length/2; save(); render();
    toast(Math.floor(ia/half)===Math.floor(ib/half)?`Court ${i+1}: ${pnm(a)} and ${pnm(b)} swapped places`:`Court ${i+1}: teams changed — ${pnm(a)} ⇄ ${pnm(b)}`);
  } else if(kind==='n'){
    const g=S.next[i]; if(!g) return; const ia=g.p.indexOf(a), ib=g.p.indexOf(b); if(ia<0||ib<0) return;
    g.p[ia]=b; g.p[ib]=a; save(); render(); toast(`Next ${i+1}: ${pnm(a)} ⇄ ${pnm(b)}`);
  }
}
document.addEventListener('pointerdown',e=>{
  if(IS_DISPLAY||IS_COURT||IS_REMOTE||e.button>0) return;
  const el=e.target.closest('[data-dd]'); if(!el||el.closest('#sheet')) return;
  dndEnd();
  dnd={el,g:el.dataset.dd,id:el.dataset.id,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false,touch:e.pointerType!=='mouse',timer:null};
  if(dnd.touch) dnd.timer=setTimeout(()=>{ if(dnd&&!dnd.on) dndStart(); },300);
});
document.addEventListener('pointermove',e=>{
  if(!dnd||e.pointerId!==dnd.pid) return;
  if(!dnd.on){ const dx=e.clientX-dnd.x, dy=e.clientY-dnd.y; if(dx*dx+dy*dy<64) return; if(dnd.touch){ dndEnd(); return; } dndStart(); }
  dnd.gh.style.left=(e.clientX-dnd.ox)+'px'; dnd.gh.style.top=(e.clientY-dnd.oy)+'px';
  const t=dndTarget(e.clientX,e.clientY);

document.addEventListener('pointerup',e=>{

  const t=dndTarget(e.clientX,e.clientY), g=dnd.g, a=dnd.id; dndBlock=Date.now(); dndEnd();
  if(t) dndSwap(g,a,t.dataset.id);
});

function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  /* xlsx-js-style = SheetJS 0.18.5 + cell styles (fonts, fills, borders) for the formatted report. APKs before 1.27 only carry
     plain SheetJS: they try the styled one online first and fall back to it (report then comes out without colours). */
  const srcs=IS_APP?['file:///android_asset/xlsx-js-style.js',XLSX_STYLE_URL,'file:///android_asset/xlsx.full.min.js']:[XLSX_STYLE_URL,'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
  const one=u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=()=>window.XLSX?res():rej();s.onerror=()=>{s.remove();rej();};document.head.appendChild(s);});
  if(!xlsxLoading) xlsxLoading=srcs.reduce((p,u)=>p.catch(()=>one(u)),Promise.reject()).catch(e=>{xlsxLoading=null;throw e;});
  return xlsxLoading;
}
function parseCat(v){

  if(CATS.includes(s)) return s;
  if(GROUPS.includes(s)) return s+'+';
  return null;
}
function importRows(rows){
  rows=rows.map(r=>(r||[]).map(x=>x==null?'':String(x).trim())).filter(r=>r.some(x=>x));
  if(!rows.length) return toast('The file looks empty');
  let nameCol=0, catCol=-1, start=0;
  const head=rows[0].map(x=>x.toLowerCase());
  /* short name ("Player Master List", "Name") is preferred over "Full Name" */
  let ni=head.findIndex(x=>/name|player/.test(x)&&!/full/.test(x)); if(ni<0) ni=head.findIndex(x=>/name|player/.test(x));
  const fni=head.findIndex((x,i)=>i!==ni&&/full\s*name/.test(x));
  const ci=head.findIndex(x=>/cat|level|skill|grade|class|group|rank/.test(x));
  let ti=head.findIndex(x=>/type|member|guest|subscri/.test(x));
  let ai=head.findIndex(x=>/active|status/.test(x));
  let gi=head.findIndex(x=>/gender|sex/.test(x));
  const tmi=head.findIndex(x=>/team|squad|club/.test(x));
  let dyi=head.findIndex(x=>/\bdays?\b|schedule/.test(x)&&!/birth/.test(x));
  if(dyi<0) head.forEach((x,i)=>{ if(/\bq(tr|uarter)/.test(x)) dyi=i; });   // club sheet: the latest quarter column ("4th Qtr": MWFSa = subscribed days, 20 / 25 = not subscribed)
  const hasHead=ni>=0||ci>=0||ti>=0||tmi>=0||ai>=0||gi>=0||fni>=0||dyi>=0;
  if(hasHead){ start=1; if(ni>=0) nameCol=ni; if(ci>=0) catCol=ci; }
  /* columns found by their values when the header is unclear (e.g. Member/Guest/Family under "Timestamp") */
  const byVals=(fn,skip)=>{ const w=Math.max(...rows.map(r=>r.length)); let best=-1,bs=0; const body=rows.slice(start).filter(r=>r.length);
    for(let c=0;c<w;c++){ if(skip.includes(c)) continue; const n=body.filter(r=>r[c]&&fn(r[c])).length; if(n>bs&&n>=body.length*0.6){bs=n;best=c;} } return best; };
  const used=()=>[nameCol,catCol,ti,ai,gi,fni,tmi,dyi].filter(x=>x>=0);
  if(ti<0) ti=byVals(v=>TYPE_RX.test(v.trim()),used());
  if(ai<0) ai=byVals(v=>!!parseStatus(v)&&/^(reg|a-?\s*sub|no|member[\s-]*sub.*|member[\s-]*guest|non[\s-]*member)$/i.test(v.trim()),used());
  if(gi<0) gi=byVals(v=>/^(male|female)$/i.test(v.trim()),used());
  if(dyi<0) dyi=byVals(v=>isDaysText(v),used());
  if(catCol<0){ // guess: the column whose values are mostly A-D
    const w=Math.max(...rows.map(r=>r.length)); let best=-1,bs=0;
    for(let c=0;c<w;c++){ if(c===nameCol) continue; const sc=rows.slice(start).filter(r=>parseCat(r[c])).length; if(sc>bs){bs=sc;best=c;} }
    catCol=best;
  }
  const idx={}; S.players.forEach(p=>idx[p.n.toLowerCase()]=p);
  let added=0, updated=0, noCat=0;
  rows.slice(start).forEach(r=>{
    const name=(r[nameCol]||'').slice(0,40); if(!name) return;
    let c=catCol>=0?parseCat(r[catCol]):null; if(!c){c=DEF_LV;noCat++;}
    const st=ai>=0?parseStatus(r[ai]):null, g=gi>=0?parseGender(r[gi]):null;
    let t=(ti>=0?parseType(r[ti]):null)||STATUS_TYPE[st]||null;
    // A-SUB = Subscriber; a plain "Member" who is not A-SUB (Reg / No) pays as a Member Guest (club 4th Qtr sheet)
    if(st==='A-SUB') t='S'; else if(t==='S'&&st&&ti>=0&&/^members?$/i.test(String(r[ti]).trim())) t='MG';
    let fn=fni>=0?String(r[fni]||'').trim().slice(0,80):''; if(/^\[?blank\]?$/i.test(fn)) fn='';
    const ex=idx[name.toLowerCase()];
    const tm=tmi>=0?String(r[tmi]||'').trim().slice(0,40):null;
    const dy=dyi>=0?parseDays(r[dyi]):[];
    if(ex){ let ch=false; const set=(k,v)=>{ if(v&&ex[k]!==v){ ex[k]=v; ch=true; } }; set('c',c); set('t',t); set('st',st); set('g',g); set('fn',fn); if(tm!==null) set('tm',tm); if(dy.length&&dy.join()!==(ex.dy||[]).join()){ ex.dy=dy; ch=true; } if(ch) updated++; }
    else { const p={id:uid(),n:name,c,t:t||'S',tm:tm||'',fn,g:g||'',st:st||TYPE_STATUS[t||'S']||'',dy}; S.players.push(p); idx[name.toLowerCase()]=p; added++; }
  });
  save(); render();
  const off=S.players.filter(isOff).length;
  toast(`Imported: ${added} added${updated?', '+updated+' updated':''}${noCat?' · '+noCat+' had no level (set to C+)':''}${off?' · '+off+' inactive (hidden in Attendance)':''}`);
}

/* Automatic updates (Android app): every time the app is opened or brought back, a newer version is downloaded and
   installed by itself. It waits while someone is busy (scoreboard, a sheet, typing, dragging) and installs as soon as
   they are done. A court tablet installs only when no match is on its court. The same version is tried automatically
   at most once per 10 minutes, so a failed install never loops; the Update bar and Settings → Update app stay. */
let updAuto=false, updWait=null;
function updIdle(){
  if(IS_COURT) return !S.courts[COURT_NO]||!S.courts[COURT_NO].p.length;
  const a=document.activeElement;
  return scoreOpen===null&&!document.getElementById('sheet').classList.contains('open')&&!dnd&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function updAutoGo(){
  clearTimeout(updWait); updWait=null;
  if(!updAuto||!updInfo||updBusy) return;
  let last={}; try{ last=JSON.parse(localStorage.getItem('mm_upd_try')||'{}')||{}; }catch(e){}
  if(+last.v===+updInfo.version&&Date.now()-(+last.t||0)<10*60*1000){ updAuto=false; return; }
  if(!updIdle()){ updWait=setTimeout(updAutoGo,2000); return; }
  updAuto=false;
  try{ localStorage.setItem('mm_upd_try',JSON.stringify({v:+updInfo.version,t:Date.now()})); }catch(e){}
  doUpdate(true);
}
async function checkUpdate(manual,auto){
  if(!IS_APP) return;
  try{
    const r=await fetch(UPD_BASE+'version.json?t='+Date.now(),{cache:'no-store'});
    const j=await r.json(); updChecked=true;
    if(+j.version>APP_VERSION){ updInfo=j; if(auto||(IS_COURT&&updIdle())){ updAuto=true; showUpdBanner(); updAutoGo(); return; } } else { updInfo=null; if(manual) toast('You have the latest version'); }
  }catch(e){ if(manual) toast('No internet — could not check for updates'); }
  showUpdBanner(); if(tab==='settings') render();
}
async function updateApp(){
  if(!IS_APP||updBusy) return;
  if(updInfo){ doUpdate(); return; }
  toast('Checking for updates…'); await checkUpdate(true);
  if(updInfo) doUpdate();

async function doUpdate(auto){

/* photos are kept as text (data:…) but shown through a short blob: link made once per photo, so a redraw of a
   100-player list does not copy ~20 KB of text per photo into the page each time */
const PH_URL=new Map();
function phSrc(u){
  if(typeof u!=='string'||u.slice(0,5)!=='data:'||!window.URL||!URL.createObjectURL) return u;
  let x=PH_URL.get(u); if(x) return x;
  try{
    const i=u.indexOf(','), meta=u.slice(5,i), bin=atob(u.slice(i+1)), a=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) a[k]=bin.charCodeAt(k);
    x=URL.createObjectURL(new Blob([a],{type:meta.split(';')[0]||'image/jpeg'}));
  }catch(e){ return u; }
  if(PH_URL.size>400){ const live=new Set(Object.values(PH)); PH_URL.forEach((v,k)=>{ if(!live.has(k)){ URL.revokeObjectURL(v); PH_URL.delete(k); } }); }

  const to=setTimeout(()=>{ if(!done){ done=true; fail('No answer. Check the PIN, and that the organizer has Match Maker open with internet.'); } },15000);
  pp.on('open',()=>{ const c=pp.connect('mm-pin-'+pin,{reliable:true});
    c.on('data',d=>{ let o=null; try{ o=JSON.parse(d); }catch(e){}
      if(o&&typeof o.url==='string'&&o.url.indexOf(SITE_URL)===0&&!done){ done=true; clearTimeout(to); pjMsg('Court '+o.court+' found — opening…'); setTimeout(()=>location.replace(o.url),300); } }); });
  pp.on('error',e=>{ if(done) return; done=true; clearTimeout(to);
    fail(e&&e.type==='peer-unavailable'?'No court with this PIN is online. Check the PIN, and that the organizer has Match Maker open with internet.':'Could not connect — check the internet and try again.'); }); }
function rtcStatusText(){ return {online:'🟢 Online — phones can connect',starting:'⏳ Going online…',reconnecting:'⏳ Reconnecting to the internet…',offline:'🔴 No internet — phones can\'t connect until this device is online'}[rtcState]||'⏳ Going online…'; }
// phone side
let rtcConn=null, rtcPeerJ=null, rtcRetry=null, rtcWatch=null;
function rtcSend(o){ if(rtcConn&&rtcConn.open){ try{ rtcConn.send(JSON.stringify(o)); return true; }catch(e){} } return false; }
function rtcLater(ms){ clearTimeout(rtcRetry); rtcRetry=setTimeout(rtcJoin,ms); }
async function rtcJoin(){
  clearTimeout(rtcRetry);
  try{ await loadPeer(); }catch(e){ rtcLater(4000); return; }
  if(!rtcPeerJ||rtcPeerJ.destroyed){
    rtcPeerJ=new Peer({debug:0});
    rtcPeerJ.on('error',()=>{ if(!rtcConn||!rtcConn.open) rtcLater(3000); });
    rtcPeerJ.on('disconnected',()=>{ setTimeout(()=>{ try{ if(!rtcPeerJ.destroyed) rtcPeerJ.reconnect(); }catch(e){} },1500); });
  }
  const go=()=>{
    if(rtcConn){ try{ rtcConn.close(); }catch(e){} }
    const c=rtcPeerJ.connect(JOIN_ID,{reliable:true}); rtcConn=c;
    clearTimeout(rtcWatch); rtcWatch=setTimeout(()=>{ if(rtcConn===c&&!c.open){ try{ c.close(); }catch(e){} rtcConn=null; rtcLater(500); } },9000);
    c.on('open',()=>{ qrPing(); postScore(); });
    c.on('data',d=>{ if(typeof d==='string') rtcGotState(d); });
    const lost=()=>{ if(rtcConn===c){ rtcConn=null; rtcLater(2000); } };
    c.on('close',lost); c.on('error',lost);
  };
  if(rtcPeerJ.open) go(); else { rtcPeerJ.once('open',go); }
}
function rtcGotState(txt){
  syncOk=Date.now(); syncFails=0;
  let d; try{ d=JSON.parse(txt); }catch(e){ return; }
  if(!d||!Array.isArray(d.players)) return;
  const mine=S.courts[COURT_NO]||null; S=normalize(d); mergeMine(mine);
  try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){}
  if(postPending) postScore();
  const key=courtKey(); if(key!==lastCourtKey){ lastCourtKey=key; render(); }
  syncHeader();
}
// a link that has gone quiet (host closed, network changed) is dropped and rebuilt
// and a phone with no link at all (however it was lost) always tries again — same QR key, no new scan
setInterval(()=>{
  if(!IS_JOIN) return;
  if(rtcConn&&rtcConn.open&&Date.now()-syncOk>15000){ try{ rtcConn.close(); }catch(e){} rtcConn=null; rtcLater(500); return; }
  if(!rtcConn) rtcLater(200);
},5000);
// Main tablet side: per-court secret keys (kept only on this tablet, never shared) and when each phone was last heard
let QRK={}; try{ QRK=JSON.parse(localStorage.getItem('mm_qr_keys')||'{}')||{}; }catch(e){ QRK={}; }
const RSEEN={};
function qrKey(c){ if(!QRK[c]){ QRK[c]=Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,8); try{ localStorage.setItem('mm_qr_keys',JSON.stringify(QRK)); }catch(e){} } return QRK[c]; }
function qrRotate(c){ delete QRK[c]; qrKey(c); }
const SITE_URL='https://archie24bagadiong-max.github.io/matchmaker-app/';
function courtUrl(i){ return SITE_URL+'?join='+hostId()+'&court='+(i+1)+'&k='+qrKey(i); }
function seenText(i){ const t=RSEEN[i]; if(!t) return 'waiting for it to check in'; const s=Math.round((Date.now()-t)/1000); return s<12?'active now':'last seen '+(s<90?s+' s':Math.round(s/60)+' min')+' ago'; }
function mergeMine(mine){
  const c=S.courts[COURT_NO];
  if(!mine||!mine.sc||!c||!sameSet(c.p,mine.p)) return;
  if(!c.sc||(mine.sc.seq||0)>(c.sc.seq||0)){ c.sc=mine.sc; postPending=true; }
}
async function postScore(){
  const c=S.courts[COURT_NO]; if(!c||!c.sc||(!MAIN_IP&&!IS_JOIN)) return;
  if(IS_REMOTE&&remoteState()!=='ok') return;
  if(posting){ postPending=true; return; }
  const body=IS_REMOTE?{c:COURT_NO,p:c.p,sc:c.sc,dev:DEV,k:QR_K}:{c:COURT_NO,p:c.p,sc:c.sc};
  if(IS_JOIN){ postPending=!rtcSend(body); if(postPending) setTimeout(postScore,1000); return; }   // kept and resent until the host has it
  posting=true; postPending=false;
  try{ const r=await fetch('http://'+MAIN_IP+':8787/score',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}); if(!r.ok) postPending=true; }
  catch(e){ postPending=true; }
  posting=false;
  if(postPending) setTimeout(postScore,1000);
}
function applyIncoming(){
  const msgs=[];
  if(ROLE==='main'&&IS_APP&&typeof AndroidApp.takeIncoming==='function'){ let m; for(let n=0;n<50&&(m=AndroidApp.takeIncoming());n++) msgs.push(m); }
  while(RTC_IN.length&&msgs.length<200) msgs.push(RTC_IN.shift());
  if(!msgs.length) return;
  let changed=false, remoteChanged=false;
  for(const msg of msgs){
    try{
      const x=JSON.parse(msg), ct=S.courts[x.c];
      if(!ct) continue;
      if(x.dev){
        // a phone that scanned a court QR code: it must hold the court's current key, and the court takes one phone
        const dev=String(x.dev).slice(0,40);
        if(!S.remote) S.remote={}; if(!S.rq) S.rq={};
        if(x.k!==qrKey(x.c)){ if(S.rq[dev]!=='key'){ S.rq[dev]='key'; const ks=Object.keys(S.rq); if(ks.length>30) delete S.rq[ks[0]]; changed=true; } continue; }
        const r=S.remote[x.c];
        if(r&&r.dev!==dev) continue;                       // court already has its phone — only the host can disconnect it
        if(!r){ S.remote[x.c]={dev,at:Date.now()}; S.kicked=(S.kicked||[]).filter(d=>d!==dev); delete S.rq[dev]; changed=true; remoteChanged=true; toast(`📱 Phone connected to Court ${x.c+1}`); }
        RSEEN[x.c]=Date.now();
        if(x.t) continue;                                  // ping / hello only
      }
      if(!x.sc||!x.sc.pos||!sameSet(ct.p,x.p)) continue;
      if(!ct.sc||(+x.sc.seq||0)>(+ct.sc.seq||0)){ ct.sc=x.sc; changed=true; }
    }catch(e){}
  }
  if(changed){ save(); render(); if(remoteChanged) refreshSheet(); }
}
const VIEW_OK=new Set(['t-fs','sc-help','go','help','help-topic','help-sec','wq-sort','pay-gone','rep-mode','stg-check','ci-f','pl-f','h-f','h-r','h-v','pay-f','score','sc-close','sync-role','sync-ip','upd-check','upd-go','upd-app','export','copypay','copy']);
if(IS_DISPLAY) document.body.classList.add('display');
if(BVIEW) document.body.classList.add('bview');
if(IS_POP) document.body.classList.add('pop');
if(IS_APP||IS_SERVED){

      if(document.visibilityState==='hidden'){ hidAt=Date.now(); return; }

    if(updJustDone) setTimeout(()=>toast('Updated to version '+fmtVer(APP_VERSION)),600);
  }
}

/* web / laptop / iPhone version: offline support + install. Not in the Android app (file://) or inside Claude. */
if(!IS_APP&&!IS_SERVED&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!(window.claude&&window.claude.use)){

/* install prompt for the website: iPhone/iPad shows Share → Add to Home Screen steps; Android/laptop Chrome gets an Install button.
   Hidden in the Android app, inside Claude, on court/display tablets, when already installed, or after "Not now". */
(function(){
  try{
    if(IS_APP||IS_COURT||IS_DISPLAY||IS_PINJOIN||(window.claude&&window.claude.use)||!/^https?:$/.test(location.protocol)) return;
    const installed=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    if(installed) return;
    let hideUntil=0; try{ hideUntil=+localStorage.getItem('mm_install_hide')||0; }catch(e){}
    if(Date.now()<hideUntil) return;
    const ua=navigator.userAgent;
    const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const share='<svg width="16" height="18" viewBox="0 0 16 18" style="vertical-align:-3px" aria-label="Share"><path d="M8 1v11M4 5l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 8H2v9h12V8h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    const bar=document.createElement('div');
    bar.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9999;max-width:520px;margin:0 auto;background:#0f3d2e;color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.35);font:15px/1.4 system-ui,-apple-system,sans-serif;display:flex;gap:12px;align-items:center';
    const close=()=>{ bar.remove(); try{ localStorage.setItem('mm_install_hide',String(Date.now()+7*864e5)); }catch(e){} };
    const btn='padding:9px 14px;border:0;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap';
    if(ios){
      const inApp=/FBAN|FBAV|Instagram|Line\/|GSA\//.test(ua);
      bar.innerHTML='<img src="icons/apple-touch-icon.png" alt="" style="width:44px;height:44px;border-radius:10px;flex:none">'
        +'<div style="flex:1"><b>Install Match Maker on your iPhone</b><br>'
        +(inApp?'Open this page in <b>Safari</b> first, then tap ':'Tap ')+'<b>Share</b> '+share+' then <b>Add to Home Screen</b> — or use the <a href="iphone.html" style="color:#c6f135;font-weight:700">one-tap installer</a>.</div>'
        +'<button style="'+btn+';background:transparent;color:#c6f135">Not now</button>';
      bar.querySelector('button').onclick=close;
      setTimeout(()=>document.body.appendChild(bar),2500);
    }else{
      window.addEventListener('beforeinstallprompt',ev=>{
        ev.preventDefault();
        bar.innerHTML='<img src="icons/icon-192.png" alt="" style="width:44px;height:44px;border-radius:10px;flex:none">'
          +'<div style="flex:1"><b>Install Match Maker</b><br>Opens like an app, works offline.</div>'
          +'<button data-a="no" style="'+btn+';background:transparent;color:#c6f135">Not now</button>'
          +'<button data-a="yes" style="'+btn+';background:#c6f135;color:#0f3d2e">Install</button>';
        bar.querySelector('[data-a=no]').onclick=close;
        bar.querySelector('[data-a=yes]').onclick=async()=>{ bar.remove(); ev.prompt(); try{ await ev.userChoice; }catch(e){} };
        document.body.appendChild(bar);
      });
      window.addEventListener('appinstalled',()=>bar.remove());
    }
  }catch(e){}
})();
})();
