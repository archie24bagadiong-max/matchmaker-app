<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Maker - JAMREIBIZ Badminton Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --court:#0f3d2e; --court2:#145a42; --line:#e9f5ee; --lime:#c8f169;
  --bg:#f3f6f2; --card:#fff; --ink:#15211b; --muted:#66756d; --border:#dfe6e0;
  --A:#e4572e; --B:#e89b0c; --C:#25a065; --D:#3a7bd5;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer;color:var(--ink)}
input,select,textarea{font:inherit;color:inherit}
header{background:var(--court);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
header h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px;letter-spacing:.5px;margin:0;flex:1;text-transform:uppercase}
header h1 span{color:var(--lime)}
header svg{flex:none}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:430px){header h1 em{font-size:10.5px;letter-spacing:1.5px} .sync span{display:none}}
header h1 em{display:block;font-style:normal;font-family:Barlow,sans-serif;font-size:12px;font-weight:700;letter-spacing:2.5px;color:#fff;opacity:.85;margin-top:2px;line-height:1.1}
.sync{font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.sync.ok i{background:var(--lime)}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 90px);max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;min-width:0;border:0;background:none;padding:10px 0 12px;color:var(--muted);font-weight:600;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--court2)}
nav button.on svg{stroke:var(--court2)}
h2{font-family:"Barlow Condensed",sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.4px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
h2 small{font-family:Barlow;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--court2);color:#fff;border-color:var(--court2)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--court)}
.btn.warn{color:#b3261e;border-color:#f0c9c6;background:#fff7f6}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45}
.cat{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:700;font-size:13px;flex:none}
.cA{background:var(--A)}.cB{background:var(--B)}.cC{background:var(--C)}.cD{background:var(--D)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{color:var(--ink);white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.chip.on{background:var(--court);color:#fff;border-color:var(--court)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed";font-size:24px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}

/* courts */
.courts{display:grid;gap:12px}
@media(min-width:720px){.courts{grid-template-columns:1fr 1fr}}
.court{background:var(--court);border-radius:var(--radius);color:#fff;overflow:hidden}
.court-h{display:flex;align-items:center;gap:8px;padding:10px 12px}
.court-h b{font-family:"Barlow Condensed";font-size:20px;text-transform:uppercase;letter-spacing:.5px}
.court-h .t{margin-left:auto;font-size:13px;opacity:.85}
.lv{display:flex;gap:4px;padding:0 12px 8px;align-items:center;font-size:12px;opacity:.95}
.lv button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:6px;width:28px;height:24px;font-weight:700;font-size:12px;padding:0}
.lv button.on{background:#fff;color:var(--court)}
.lv span{margin-right:4px;opacity:.75}
.pitch{margin:0 12px;border:2px solid var(--line);border-radius:6px;display:grid;grid-template-columns:minmax(0,1fr) 2px minmax(0,1fr);min-height:120px;background:var(--court2)}
.net{background:var(--line);opacity:.9}
.side{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:8px 6px;min-width:0}
.pl{background:rgba(255,255,255,.96);color:var(--ink);border:0;border-radius:10px;padding:7px 6px;display:flex;align-items:center;gap:5px;min-width:0;text-align:left;font-weight:600;font-size:15px;min-height:40px;width:100%}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .g{font-size:11px;color:var(--muted);font-weight:500;flex:none}
.pl .gb{font-size:9px;padding:1px 4px}
.empty-court{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:14px;padding:20px;text-align:center}
.court-f{display:flex;gap:8px;padding:12px}
.court-f .btn{flex:1;padding:10px 8px}
.court-f .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:13px;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.item.sel .check{background:var(--court2);border-color:var(--court2)}
.item.sel .check:after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tapr{cursor:pointer;user-select:none}
.wait{display:flex;flex-wrap:wrap;gap:6px}
.wp{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px 10px 6px 6px;font-weight:600;font-size:14px}
.wp small{color:var(--muted);font-weight:500}
.wp.rest{border-style:dashed}
input[type=text],input[type=search],select,textarea{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
textarea{min-height:140px;resize:vertical}
select.mini{width:auto;padding:6px 8px;border-radius:8px}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0;line-height:1.4}
.seg{display:flex;background:#e6ece7;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.set{display:flex;flex-direction:column;gap:14px}
.set label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-family:"Barlow Condensed";font-size:24px;min-width:26px;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,25,18,.45);z-index:50;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:60;max-height:82vh;overflow:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .22s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#d5ddd7;margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.toast{z-index:100 !important;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.gb{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#fff1d6;color:#8a5a00;border:1px solid #f0d49a;border-radius:5px;padding:1px 5px;line-height:1.4;flex:none}
.gb.sb{background:#e3eefb;color:#1f4f8f;border-color:#bcd3f0}
.typeb{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;min-width:44px}
.typeb.g{background:#fff1d6;border-color:#f0d49a;color:#8a5a00}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl .nmc{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:0}
.pinfo{flex:1;min-width:0}
.pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pnote{font-size:12px;color:var(--muted);margin-top:2px}
.phead{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 0;border-bottom:2px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.phead .pfee{text-align:right;display:block}
.pg{width:56px;text-align:center;flex:none}
.pg b{font-family:'Barlow Condensed';font-size:22px}
.pfee{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:74px;font-size:14px}
.gadj{display:inline-flex;align-items:center;gap:6px;flex:none}
.gadj b{min-width:20px;text-align:center;font-family:'Barlow Condensed';font-size:20px}
.gadj button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#f3f6f2;padding:0;font-weight:700;font-size:20px;line-height:1;color:var(--court)}
.paidb{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;background:#fff;color:var(--muted)}
.paidb.on{background:var(--C);border-color:var(--C);color:#fff}
.money{font-family:'Barlow Condensed';font-size:22px}
.gpill{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e7f0ea;color:var(--court2);white-space:nowrap}
.gpill.z{background:#eaf7d0;color:#3d6b00}
.winb{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:2px solid var(--border);background:#fff;border-radius:12px;padding:12px;text-align:left}
.winb:active{border-color:var(--C);background:#eefaf3}
.wl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.tm{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.tm span:not(.cat):not(.gb){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcard{margin-bottom:10px;padding:12px}
.hh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.hh b{font-family:'Barlow Condensed';font-size:18px;text-transform:uppercase}
.hh span{font-size:13px;color:var(--muted)}
.hteams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.ht{border:1px solid var(--border);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ht.won{border:2px solid var(--C);background:#eefaf3}
.trophy{font-size:11px;font-weight:700;color:var(--C);text-transform:uppercase;letter-spacing:.3px}
.vs{align-self:center;font-size:12px;color:var(--muted);font-weight:700}
.hf{display:flex;align-items:center;gap:6px;margin-top:8px}
.pgs{width:40px;text-align:center;flex:none;font-size:14px}
.phead .pgs{font-size:10px}
.nmc{flex-wrap:nowrap}
.rk{font-family:'Barlow Condensed';font-weight:700;color:var(--muted);min-width:18px}
.filebtn{position:relative;display:inline-block;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
#updbar{position:sticky;top:72px;z-index:19;background:var(--lime);color:var(--court);display:flex;align-items:center;gap:10px;padding:8px 14px;font-weight:600;font-size:14px}
#updbar span{flex:1}
#updbar .btn{background:var(--court);color:#fff;border-color:var(--court)}
.sstrip{padding:8px 12px 0}
.sbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.sbtn b{font-family:'Barlow Condensed';font-size:20px;color:var(--lime)}
.sbtn .gw{font-size:13px;opacity:.85}
.hscore{margin-top:8px;font-size:14px;color:var(--muted)}
.hscore b{color:var(--ink)}
body.noscroll{overflow:hidden}
.scorev{position:fixed;inset:0;z-index:90;background:var(--court);color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.scorev[hidden]{display:none}
.sbar{display:flex;align-items:center;gap:10px}
.sbar b{font-family:'Barlow Condensed';font-size:24px;text-transform:uppercase}
.sbar span{flex:1;opacity:.8;font-size:14px}
.smsg{margin:8px 0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.1);font-size:15px;line-height:1.35}
.smsg b{color:var(--lime)}
.sboard{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 3px minmax(0,1fr);gap:10px;min-height:0;overflow:hidden}
.snet{background:var(--line);opacity:.8;border-radius:2px}
.sside{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;border-radius:14px;padding:8px;border:2px solid transparent}
.sside.serving{border-color:var(--lime)}
.sside.won{background:rgba(200,241,105,.15);border-color:var(--lime)}
.steam{display:flex;flex-direction:column;gap:6px}
.spl{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;min-width:0}
.spl.srv{background:var(--lime);color:var(--court)}
.spl.rcv{background:rgba(255,255,255,.25)}
.sct{font-size:11px;font-weight:700;text-transform:uppercase;opacity:.7;width:38px;flex:none}
.spn{font-weight:700;font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stag{font-size:10px;font-weight:800;letter-spacing:.5px;flex:none}
.stag.r{opacity:.85}
.sdots{display:flex;gap:6px;justify-content:center}
.sgw{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;gap:4px 10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 12px}
.sgw.has{background:rgba(200,241,105,.16);border-color:var(--lime)}
.sgw-l{display:flex;flex-direction:column;gap:6px}
.sgw-l span{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.sgw-l .sdots{justify-content:flex-start}
.sgw>b{grid-row:1/3;grid-column:2;font-family:'Barlow Condensed';font-weight:800;font-size:clamp(44px,8vh,72px);line-height:1;color:var(--lime);min-width:40px;text-align:center}
.sgw-g{display:flex;gap:6px;flex-wrap:wrap}
.sgw-g i{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
.sgw-g i.w{background:var(--lime);color:var(--court)}
.sgw-g i.n{opacity:.6;background:none;padding:2px 0;font-weight:500}
@media (min-height:820px){
  .sgw{padding:16px 18px;gap:10px 14px;border-width:2px}
  .sgw-l span{font-size:15px}
  .sgw>b{font-size:clamp(90px,11vh,140px)}
  .sgw .sdots i{width:16px;height:16px}
  .sgw-g i{font-size:16px;padding:4px 12px}
  .sside .spt{flex:0 1 52vh}
  .sside .spt span{font-size:clamp(90px,min(24vw,26vh),240px)}
}
.sdots i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.sdots i.on{background:var(--lime);border-color:var(--lime)}
.spt{flex:1;min-height:0;overflow:hidden;border-radius:16px;border:0;background:rgba(255,255,255,.95);color:var(--court);display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.spt span{font-family:'Barlow Condensed';font-weight:800;font-size:clamp(56px,min(22vw,30vh),220px);line-height:1}
@media (max-height:560px){
  .scorev{padding:calc(env(safe-area-inset-top) + 4px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 10px)}
  .sbar b{font-size:18px}
  .sbar span{font-size:12px}
  .sbar .btn{padding:3px 8px}
  .smsg{margin:4px 0;padding:5px 10px;font-size:13px}
  .sboard{gap:6px}
  .sside{gap:4px;padding:4px}
  .steam{flex-direction:row;gap:4px}
  .spl{flex:1;padding:3px 6px;gap:4px;border-radius:8px}
  .sct{display:none}
  .spl .av{width:26px;height:26px;border-width:1px}
  .spl .av.ini{font-size:11px}
  .spn{font-size:14px}
  .stag{font-size:8.5px}
  .sgw{padding:3px 8px;gap:2px 8px}
  .sgw-l span{font-size:10px}
  .sgw .sdots{display:none}
  .sgw>b{font-size:30px}
  .sgw-g i{font-size:10.5px;padding:1px 6px}
  .sgw-g{display:none}
  .stsel{padding:3px 8px;font-size:15px}
  .sgw{grid-template-rows:auto}
  .spt span{font-size:clamp(40px,min(22vw,26vh),220px)}
  .spt{max-height:none}
  .sctl{flex-direction:row}
  .sctl .btn{flex:1;padding:5px 8px;font-size:13px}
  .sprev{margin:3px 0;font-size:15px}
  .sprev span{white-space:nowrap}
  .sfoot{gap:6px}
  .sfoot .btn{padding:6px 8px;font-size:14px}
  .cdone{font-size:13px;padding:4px}
  .cw-big{font-size:44px}
  .cw-t{font-size:26px}
}
.spt:active{background:var(--lime)}
.spt:disabled{opacity:.55}
.sctl{display:flex;flex-direction:column;gap:6px}
.sctl .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.sprev{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 6px;font-family:'Barlow Condensed';font-size:20px;opacity:.9}
.sfoot{display:flex;gap:8px}
.sfoot .btn{flex:1}
.sfoot .big{flex:2}
.scflash{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);background:var(--lime);color:var(--court);font-weight:800;font-size:22px;padding:14px 22px;border-radius:14px;opacity:0;pointer-events:none;text-align:center;max-width:86vw}
.scflash.on{animation:fl 2.2s ease}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}10%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.syncbox{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bigip{font-family:'Barlow Condensed';font-size:34px;font-weight:800;color:var(--court2);letter-spacing:.5px;word-break:break-all}
body.display .court-f,body.display .lv button,body.display .sfoot,body.display .sctl,body.display [data-act=fill-all]{pointer-events:none;opacity:.35}
body.display .spt{pointer-events:none}

<script>
(function(){
const CATS=['A','B','C','D'];
const RATE={A:4,B:3,C:2,D:1};
const APP_VERSION=18;
const IS_APP=!!window.AndroidApp;
const UPD_BASE='https://raw.githubusercontent.com/archie24bagadiong-max/matchmaker-app/main/';
let ROLE='off', MAIN_IP='';
try{ ROLE=localStorage.getItem('bmm_role')||'off'; MAIN_IP=localStorage.getItem('bmm_main_ip')||''; }catch(e){}
const CAN_SYNC=IS_APP&&typeof window.AndroidApp.startServer==='function';
if(!CAN_SYNC) ROLE='off';
const IS_DISPLAY=ROLE==='display';
const IS_COURT=ROLE==='court';
let COURT_NO=0, COURT_PIN='';
try{ COURT_NO=Math.max(0,(+localStorage.getItem('bmm_court')||1)-1); COURT_PIN=localStorage.getItem('bmm_pin')||''; }catch(e){}
const LS_KEY=IS_APP?(IS_DISPLAY?'bmm_display_v1':IS_COURT?'bmm_court_v1':'bmm_offline_v1'):'bmm_state_v1';
const CLIENT=Math.random().toString(36).slice(2);

function fresh(){
  return {players:[],present:{},resting:{},games:{},lastEnd:{},partners:{},
    courts:[0,1,2].map(()=>({lv:CATS.slice(),p:[],t:0})),
    mode:'doubles',mix:'adjacent',autoNext:true,prio:'strong',paid:{},hist:[],ledger:[],teams:[],match:{n:3,pts:21,mode:'best'},fee:{gp:25,gn:3,gx:10,sp:2.5}};
}
function normalize(s){
  const d=fresh();
  s=(s&&typeof s==='object')?s:{};
  for(const k in d){ if(s[k]===undefined) s[k]=d[k]; }
  if(!Array.isArray(s.players)) s.players=[];
  s.players=s.players.filter(p=>p&&p.id&&typeof p.n==='string').map(p=>({id:String(p.id),n:p.n.slice(0,40),c:CATS.includes(p.c)?p.c:'C',t:p.t==='G'?'G':'S',tm:typeof p.tm==='string'?p.tm.trim().slice(0,40):''}));
  if(!Array.isArray(s.courts)||!s.courts.length) s.courts=d.courts;
  s.courts=s.courts.map(c=>({lv:Array.isArray(c&&c.lv)?c.lv.filter(x=>CATS.includes(x)):CATS.slice(),p:Array.isArray(c&&c.p)?c.p.map(String):[],t:+(c&&c.t)||0,sc:(c&&c.sc&&typeof c.sc==='object'&&c.sc.pos)?c.sc:null}));
  if(!Array.isArray(s.teams)) s.teams=[];
  s.teams=[...new Set(s.teams.filter(x=>typeof x==='string').map(x=>x.trim().slice(0,40)).filter(Boolean))];
  if(!Array.isArray(s.hist)) s.hist=[];
  if(!Array.isArray(s.ledger)) s.ledger=[];
  s.ledger=s.ledger.slice(-4000);
  s.hist=s.hist.filter(x=>x&&Array.isArray(x.a)&&Array.isArray(x.b)).slice(-1000);
  ['present','resting','games','lastEnd','partners'].forEach(k=>{if(typeof s[k]!=='object'||!s[k]||Array.isArray(s[k]))s[k]={};});
  if(!['doubles','singles'].includes(s.mode)) s.mode='doubles';
  if(!['strict','adjacent','any'].includes(s.mix)) s.mix='adjacent';
  s.autoNext=!!s.autoNext;
  s.phRev=+s.phRev||0;
  const mf=(s.match&&typeof s.match==='object')?s.match:{};
  s.match={n:[1,2,3,4,5].includes(+mf.n)?+mf.n:3, pts:[11,15,21].includes(+mf.pts)?+mf.pts:21, mode:mf.mode==='all'?'all':'best'};
  if(!['strong','tie','none'].includes(s.prio)) s.prio='strong';
  if(typeof s.paid!=='object'||!s.paid||Array.isArray(s.paid)) s.paid={};
  const f=(s.fee&&typeof s.fee==='object')?s.fee:{};
  s.fee={gp:isFinite(+f.gp)&&+f.gp>=0?+f.gp:25, gn:isFinite(+f.gn)&&+f.gn>=1?Math.round(+f.gn):3, gx:f.gx!==undefined&&f.gx!==null&&f.gx!==''&&isFinite(+f.gx)&&+f.gx>=0?+f.gx:10, sp:isFinite(+f.sp)&&+f.sp>=0?+f.sp:2.5};
  return s;
}

let S=fresh();
try{ const raw=localStorage.getItem(LS_KEY); if(raw) S=normalize(JSON.parse(raw)); }catch(e){}

let tab='courts', ciFilter='All', ciSearch='', plSearch='', plFilter='All', confirmKey=null, plTeam='', ciTeam='';

/* ---------- persistence ---------- */
let dbRef=null, writing=false, dirty=false, saveTimer=null, lastTs=0;
function setSync(ok,label){const el=document.getElementById('sync');el.className='sync'+(ok?' ok':'');el.querySelector('span').textContent=label;}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  shareState();
  if(!dbRef) return;
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,600);
}
async function flush(){
  if(!dbRef||writing||!dirty) return;
  writing=true; dirty=false; lastTs=Date.now();
  try{ await dbRef.set({state:JSON.stringify(S),client:CLIENT,ts:lastTs}); setSync(true,'Synced'); }
  catch(e){ if(e&&e.code==='invalid_argument'){setSync(false,'View only');} else {setSync(false,'Offline'); dirty=true;} }
  writing=false;
  if(dirty) saveTimer=setTimeout(flush,800);
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const db=await window.claude.use('db');
    if(!db) return;
    dbRef=db.doc('club/state');
    photoDb=db;
    try{ db.collection('photos').onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ const x=d.data(); if(x&&typeof x.u==='string') m[d.id]=x.u; }); PH=m; try{localStorage.setItem(PH_KEY,JSON.stringify(PH));}catch(e){} render(); },()=>{}); }catch(e){}
    setSync(false,'Connecting…');
    let first=true;
    const to=setTimeout(()=>setSync(false,'Offline'),10000);
    dbRef.onSnapshot(snap=>{
      if(!snap.metadata.fromCache) clearTimeout(to);
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.exists){
        if(first&&S.players.length){ dirty=true; flush(); }
        first=false; if(!snap.metadata.fromCache) setSync(true,'Synced'); return;
      }
      const d=snap.data();
      first=false;
      if(!snap.metadata.fromCache) setSync(true,'Synced');
      if(d.client===CLIENT && d.ts<=lastTs) return;
      if(dirty||writing) return;
      try{ S=normalize(JSON.parse(d.state)); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} render(); }catch(e){}
    },err=>{clearTimeout(to);setSync(false,'Local');});
  }catch(e){}
})();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>S.players.find(p=>p.id===id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const need=()=>S.mode==='doubles'?4:2;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function onCourt(){const m={};S.courts.forEach((c,i)=>c.p.forEach(id=>m[id]=i));return m;}
function pkey(a,b){return a<b?a+'|'+b:b+'|'+a;}
function allTeamNames(){ const s=new Set((S.teams||[]).concat(teamsList())); S.hist.slice(-300).forEach(x=>{ if(x.ta) s.add(x.ta); if(x.tb) s.add(x.tb); }); S.courts.forEach(c=>{ if(c.sc&&c.sc.tn){ if(c.sc.tn.a) s.add(c.sc.tn.a); if(c.sc.tn.b) s.add(c.sc.tn.b); } }); return [...s].filter(Boolean).sort((a,b)=>a.localeCompare(b)); }
function teamsList(){ return [...new Set(S.players.map(p=>p.tm).filter(Boolean))].sort((a,b)=>a.localeCompare(b)); }
function teamTag(p){ return p&&p.tm?`<span class="tmtag">${esc(p.tm)}</span>`:''; }
function teamDatalist(){ return `<datalist id="teamlist">${allTeamNames().map(t=>`<option value="${esc(t)}">`).join('')}</datalist>`; }
function commonTeam(ids){ const t=ids.map(id=>(byId(id)||{}).tm||''); return t.length&&t[0]&&t.every(x=>x===t[0])?t[0]:''; }
function teamFilterSel(cur,act){ const ts=teamsList(); if(!ts.length) return ''; return `<select class="mini tfsel" data-act="${act}"><option value="">All teams</option>${ts.map(t=>`<option ${t===cur?'selected':''} value="${esc(t)}">${esc(t)}</option>`).join('')}<option value="__none" ${cur==='__none'?'selected':''}>No team</option></select>`; }
const teamMatch=(p,f)=>!f||(f==='__none'?!p.tm:p.tm===f);
function catBadge(c){return `<span class="cat c${c}">${c}</span>`;}
function typeBadge(p){return p.t==='G'?'<span class="gb">Guest</span>':'<span class="gb sb">Sub</span>';}
function isG(p){return p.t==='G'?1:0;}
function prioritySort(list){
  const g=(a,b)=>S.prio==='none'?0:isG(a)-isG(b);
  const n=(a,b)=>((S.games[a.id]||0)-(S.games[b.id]||0));
  return list.slice().sort((a,b)=>(S.prio==='strong'?(g(a,b)||n(a,b)):(n(a,b)||g(a,b)))||((S.lastEnd[a.id]||0)-(S.lastEnd[b.id]||0))||a.n.localeCompare(b.n));
}
function fee(p){
  const g=S.games[p.id]||0; if(!g) return 0;
  if(p.t!=='G') return g*S.fee.sp;
  return S.fee.gp+Math.max(0,g-S.fee.gn)*(S.fee.gx/S.fee.gn);
}
const sr=v=>(Math.round(v*100)/100).toFixed(2).replace(/\.00$/,'')+' SR';
function waiting(){
  const oc=onCourt();
  return prioritySort(S.players.filter(p=>S.present[p.id]&&!S.resting[p.id]&&oc[p.id]===undefined));
}
function dist(a,b){return Math.abs(RATE[a]-RATE[b]);}
function allowed(d){return S.mix==='strict'?d===0:S.mix==='adjacent'?d<=1:true;}

/* ---------- matching ---------- */
function pickGroup(pool,n){
  // the longest-waiting player who can make a full group is the seed; others chosen around them
  for(let s=0;s<pool.length;s++){
    const seed=pool[s];
    const cands=pool.filter((p,i)=>i!==s&&allowed(dist(p.c,seed.c)))
      .map(p=>({p,score:(S.prio==='strong'&&isG(p)?100000:0)+dist(p.c,seed.c)*1000+pool.indexOf(p)}))
      .sort((a,b)=>a.score-b.score).map(x=>x.p);
    if(cands.length>=n-1) return [seed].concat(cands.slice(0,n-1));
  }
  return null;
}
function arrange(ids){
  if(ids.length!==4) return ids;
  const opts=[[0,1,2,3],[0,2,1,3],[0,3,1,2]];
  let best=null,bc=Infinity;
  for(const o of opts){
    const P=o.map(i=>ids[i]); const r=id=>RATE[byId(id).c];
    const diff=Math.abs(r(P[0])+r(P[1])-r(P[2])-r(P[3]));
    const rep=(S.partners[pkey(P[0],P[1])]||0)+(S.partners[pkey(P[2],P[3])]||0);
    const cost=diff*10+rep;
    if(cost<bc){bc=cost;best=P;}
  }
  return best;
}
function fillCourt(i,quiet,exclude){
  const c=S.courts[i]; if(c.p.length) return true;
  const pool=waiting().filter(p=>c.lv.includes(p.c)&&!(exclude&&exclude.includes(p.id)));
  const g=pickGroup(pool,need());
  if(!g){ if(!quiet) toast(`Court ${i+1}: not enough waiting players for its levels`); return false; }
  c.p=arrange(g.map(p=>p.id)); c.t=Date.now(); c.sc=null;
  return true;
}
function fillAll(){
  let n=0; S.courts.forEach((c,i)=>{ if(!c.p.length && fillCourt(i,true)) n++; });
  save(); render(); toast(n?`Filled ${n} court${n>1?'s':''}`:'No court could be filled — check attendance & levels');
}
function finish(i,count,win){
  const c=S.courts[i]; const now=Date.now();
  if(count&&c.p.length){
    const half=c.p.length/2, A=c.p.slice(0,half), B=c.p.slice(half), nm=id=>(byId(id)||{}).n||'?';
    S.hist.push({d:now,s:c.t||now,c:i+1,a:A,b:B,an:A.map(nm),bn:B.map(nm),ta:c.sc?scTN(c.sc,'a'):commonTeam(A),tb:c.sc?scTN(c.sc,'b'):commonTeam(B),w:win||'',sc:scSummary(c.sc)});
    if(S.hist.length>1000) S.hist=S.hist.slice(-1000);
  }
  if(count){
    c.p.forEach(id=>{S.games[id]=(S.games[id]||0)+1;S.lastEnd[id]=now;});
    if(c.p.length===4){[[0,1],[2,3]].forEach(([a,b])=>{const k=pkey(c.p[a],c.p[b]);S.partners[k]=(S.partners[k]||0)+1;});}
  }
  c.p=[];c.t=0;c.sc=null;
  save(); render();
}
function substitutes(courtIdx,outId){
  const c=S.courts[courtIdx], out=byId(outId);
  return waiting().filter(p=>c.lv.includes(p.c))
    .map((p,i)=>({p,score:(S.prio==='strong'&&isG(p)?100000:0)+dist(p.c,out.c)*1000+i})).sort((a,b)=>a.score-b.score).map(x=>x.p);
}
function replace(courtIdx,outId,inId,rest){
  const c=S.courts[courtIdx]; const k=c.p.indexOf(outId); if(k<0) return;
  if(rest) S.resting[outId]=1;
  if(c.sc&&c.sc.pos){ ['a','b'].forEach(t=>{ c.sc.pos[t]=c.sc.pos[t].map(x=>x===outId?(inId||x):x); }); }
  if(inId){ c.p[k]=inId; }
  else{
    const subs=substitutes(courtIdx,outId).filter(p=>p.id!==outId);
    if(!subs.length){ toast('No substitute available — player removed'); c.p.splice(k,1); c.sc=null; }
    else { c.p[k]=subs[0].id; if(c.sc&&c.sc.pos){ ['a','b'].forEach(t=>{ c.sc.pos[t]=c.sc.pos[t].map(x=>x===outId?subs[0].id:x); }); } }
  }
  closeSheet(); save(); render();
}

/* ---------- scoring (BWF: 21 pts, win by 2, cap 30, best of 3) ---------- */
const capFor=p=>p===21?30:p===15?21:p===11?15:p+9;
function curRules(){ const m=S.match||{n:3,pts:21,mode:'best'}; return {n:m.n,pts:m.pts,cap:capFor(m.pts),mode:m.n===1?'best':(m.n%2===0?'all':m.mode)}; }
const RU=sc=>(sc&&sc.r)||{n:3,pts:21,cap:30,mode:'best'};
const needWins=r=>Math.floor(r.n/2)+1;
function fmtLabel(r){ return r.n===1?'1 game to '+r.pts:(r.mode==='all'?'Play all '+r.n+' games':'Best of '+r.n)+' · to '+r.pts; }
let scoreOpen=null, scoreDeferred=false, teamPick=null;
function setTeamName(i,t,v){ const sc=scEnsure(i); if(!sc||!t) return; sc.tn=Object.assign({a:scTN(sc,'a'),b:scTN(sc,'b')},sc.tn||{}); sc.tn[t]=v; sc.seq=(sc.seq||0)+1; teamPick=null; save(); try{ document.activeElement&&document.activeElement.blur(); }catch(e){} scoreDeferred=false; renderScore(); toast(v?'Team name: '+v:'Team name removed'); }
document.addEventListener('focusout',e=>{ if(e.target.tagName==='INPUT'&&((e.target.classList&&e.target.classList.contains('stsel'))||e.target.id==='tp-in')) setTimeout(()=>{ if(scoreDeferred){ scoreDeferred=false; renderScore(); } },60); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='tp-in'){ e.preventDefault(); const b=document.querySelector('[data-act=sc-tuse]'); b&&b.click(); } });
function scEnsure(i){
  const c=S.courts[i]; if(!c||!c.p.length) return null;
  if(!c.sc){ const half=c.p.length/2, A=c.p.slice(0,half), B=c.p.slice(half); c.sc={r:curRules(),g:[],a:0,b:0,srv:'',pos:{a:A,b:B},tn:{a:commonTeam(A),b:commonTeam(B)},undo:[],done:''}; }
  return c.sc;
}
const scTN=(sc,t)=>sc&&sc.tn&&typeof sc.tn[t]==='string'?sc.tn[t]:(sc?commonTeam(sc.pos[t]):'');
const scWho=(sc,t)=>{ const tn=scTN(sc,t), nm=scTeam(sc,t); return tn?tn+' ('+nm+')':nm; };
const scTeam=(sc,t)=>sc.pos[t].map(id=>(byId(id)||{}).n||'?').join(' & ');
function scLeader(sc){
  if(!sc) return '';
  if(sc.done) return sc.done==='d'?'':sc.done;
  const ga=scWon(sc,'a'), gb=scWon(sc,'b');
  if(ga!==gb) return ga>gb?'a':'b';
  if(sc.a!==sc.b) return sc.a>sc.b?'a':'b';
  return '';
}
const scWon=(sc,t)=>sc.g.filter(x=>t==='a'?x[0]>x[1]:x[1]>x[0]).length;
const scGameOver=(sc,a,b)=>{const r=RU(sc),m=Math.max(a,b);return (m>=r.pts&&Math.abs(a-b)>=2)||m>=r.cap;};
function scSummary(sc){
  if(!sc) return '';
  const parts=sc.g.map(x=>x[0]+'–'+x[1]);
  if(!sc.done&&(sc.a||sc.b)) parts.push(sc.a+'–'+sc.b+' (unfinished)');
  return parts.join(', ');
}
function scServerId(sc){ if(!sc.srv) return ''; const pos=sc.pos[sc.srv]; return pos.length>1?pos[sc[sc.srv]%2]:pos[0]; }
function scReceiverId(sc){ if(!sc.srv) return ''; const o=sc.srv==='a'?'b':'a', pos=sc.pos[o]; return pos.length>1?pos[sc[sc.srv]%2]:pos[0]; }
function scPush(sc){ sc.undo.push(JSON.stringify({g:sc.g,a:sc.a,b:sc.b,srv:sc.srv,pos:sc.pos,done:sc.done,flip:!!sc.flip})); if(sc.undo.length>80) sc.undo.shift(); }
function scPoint(i,t){
  const sc=scEnsure(i); if(!sc||sc.done) return;
  if(!sc.srv){ toast('First choose who serves'); return; }
  scPush(sc); sc.seq=(sc.seq||0)+1;
  const o=t==='a'?'b':'a';
  if(sc.srv===t){ if(sc.pos[t].length>1) sc.pos[t]=[sc.pos[t][1],sc.pos[t][0]]; } // serving side wins: same server, switches service court
  else sc.srv=t;                                                                   // receiving side wins: they serve next
  sc[t]++;
  const r=RU(sc), gi=sc.g.length+1, deciding=gi===r.n, mid=Math.ceil(r.pts/2);
  if(scGameOver(sc,sc.a,sc.b)){
    sc.g.push([sc.a,sc.b]);
    const w=sc.a>sc.b?'a':'b';
    let over=false;
    if(r.mode==='best'){ if(scWon(sc,w)>=needWins(r)||sc.g.length>=r.n){ over=true; sc.done=w; } }
    else if(sc.g.length>=r.n){ over=true; const ga=scWon(sc,'a'), gb=scWon(sc,'b');
      if(ga!==gb) sc.done=ga>gb?'a':'b';
      else { const pa=sc.g.reduce((s,x)=>s+x[0],0), pb=sc.g.reduce((s,x)=>s+x[1],0); sc.done=pa===pb?'d':(pa>pb?'a':'b'); } }
    if(over){ flash(sc.done==='d'?'Match drawn — '+scWon(sc,'a')+'–'+scWon(sc,'b')+' in games':'🏆 '+scWho(sc,sc.done)+' win the match!'); }
    else { sc.a=0; sc.b=0; sc.srv=w; sc.flip=!sc.flip; flash('Game '+gi+' to '+(scTN(sc,w)||scTeam(sc,w))+' — teams change ends ⇄'); }
  } else if(sc[t]===mid&&sc[o]<mid){ if(deciding&&r.n>1){ sc.flip=!sc.flip; flash('Interval — teams change ends ⇄'); } else flash('Interval ('+mid+' points)'); }
  else if(sc.a===r.pts-1&&sc.b===r.pts-1){ flash((r.pts-1)+' all — win by 2 (max '+r.cap+')'); }
  else if(sc.a===r.cap-1&&sc.b===r.cap-1){ flash((r.cap-1)+' all — next point wins'); }
  save(); renderScore();
}

function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function fmtTime(t){try{return new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
function fmtDay(t){try{return new Date(t).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short',year:'numeric'});}catch(e){return '';}}
function teamStats(H){
  const st={};
  H.forEach(x=>{ [['a',x.ta],['b',x.tb]].forEach(([s,n])=>{ if(!n) return; const r=st[n]||(st[n]={n,p:0,w:0,l:0}); r.p++; if(x.w===s) r.w++; else if(x.w) r.l++; }); });
  return Object.values(st).sort((a,b)=>b.w-a.w||(b.w/(b.w+b.l||1))-(a.w/(a.w+a.l||1))||b.p-a.p);
}
function vHist(){
  const today=dayKey(Date.now());
  let H=S.hist.filter(x=>histRange==='all'||dayKey(x.d)===today);
  const courtsUsed=[...new Set(S.hist.map(x=>x.c))].sort((a,b)=>a-b);
  const tabs=`<div class="seg" style="margin-bottom:10px"><button class="${histView==='matches'?'on':''}" data-act="h-v" data-k="matches">Matches</button><button class="${histView==='board'?'on':''}" data-act="h-v" data-k="board">Players</button><button class="${histView==='teams'?'on':''}" data-act="h-v" data-k="teams">Teams</button></div>
  <div class="chips" style="margin-bottom:8px"><button class="chip ${histRange==='today'?'on':''}" data-act="h-r" data-k="today">Today</button><button class="chip ${histRange==='all'?'on':''}" data-act="h-r" data-k="all">All dates</button><span class="grow"></span><button class="btn sm pri" data-act="export">Export Excel</button></div>`;
  if(histView==='teams'){
    const ts=teamStats(H);
    return tabs+`<div class="card">${ts.length?`<div class="phead"><span class="pinfo">Team</span><span class="pgs">Played</span><span class="pgs">Won</span><span class="pgs">Lost</span><span class="pgs">Win %</span></div><div class="list">${ts.map((r,i)=>`<div class="prow"><div class="pinfo"><div class="nmc"><span class="rk">${i+1}</span><span class="pn">${esc(r.n)}</span></div></div><div class="pgs">${r.p}</div><div class="pgs"><b style="color:var(--C)">${r.w}</b></div><div class="pgs">${r.l}</div><div class="pgs">${r.w+r.l?Math.round(r.w*100/(r.w+r.l))+'%':'—'}</div></div>`).join('')}</div>`:'<div class="emptybox"><b>No team results yet</b>Give players a team (Players → Edit) or pick team names on the scoreboard.</div>'}</div>`;
  }
  if(histView==='board'){
    const st={};
    H.forEach(x=>{[['a',x.a,x.an],['b',x.b,x.bn]].forEach(([s,ids,ns])=>ids.forEach((id,j)=>{const r=st[id]||(st[id]={id,n:(byId(id)||{}).n||ns[j],p:0,w:0,l:0});r.p++; if(x.w===s)r.w++; else if(x.w)r.l++;}));});
    const rows=Object.values(st).sort((a,b)=>b.w-a.w||(b.w/(b.w+b.l||1))-(a.w/(a.w+a.l||1))||b.p-a.p);
    return tabs+`<div class="card">${rows.length?`<div class="phead"><span class="pinfo">Player</span><span class="pgs">Played</span><span class="pgs">Won</span><span class="pgs">Lost</span><span class="pgs">Win %</span></div><div class="list">${rows.map((r,i)=>{const p=byId(r.id);const pct=r.w+r.l?Math.round(r.w*100/(r.w+r.l))+'%':'—';
      return `<div class="prow"><div class="pinfo"><div class="nmc"><span class="rk">${i+1}</span>${p?catBadge(p.c):''}<span class="pn">${esc(r.n)}</span>${p?typeBadge(p):''}</div></div><div class="pgs">${r.p}</div><div class="pgs"><b style="color:var(--C)">${r.w}</b></div><div class="pgs">${r.l}</div><div class="pgs">${pct}</div></div>`}).join('')}</div>`:'<div class="emptybox"><b>No results yet</b>Pick the winning team when you tap “Game done”.</div>'}</div>`;
  }
  if(histCourt!=='All') H=H.filter(x=>String(x.c)===histCourt);
  H=H.slice().reverse();
  let h=tabs+`<div class="chips" style="margin-bottom:12px">${['All'].concat(courtsUsed.map(String)).map(k=>`<button class="chip ${histCourt===k?'on':''}" data-act="h-f" data-k="${k}">${k==='All'?'All courts':'Court '+k}</button>`).join('')}</div>`;
  if(!H.length) return h+`<div class="card emptybox"><b>No matches yet</b>Finished games show up here with the court and the winning team.</div>`;
  let lastDay='';
  H.forEach((x,idx)=>{
    const dk=dayKey(x.d); if(dk!==lastDay){lastDay=dk; h+=`<h2 style="margin-top:${idx?18:4}px">${fmtDay(x.d)} <small>${S.hist.filter(y=>dayKey(y.d)===dk).length} matches</small></h2>`;}
    const mins=Math.max(1,Math.round((x.d-x.s)/60000));
    const team=(ids,ns,won,tn)=>`<div class="ht ${won?'won':''}">${won?'<span class="trophy">🏆 Winner</span>':''}${tn?`<div class="htn">${esc(tn)}</div>`:''}${ids.map((id,j)=>{const p=byId(id);return `<div class="tm">${p?catBadge(p.c):''}<span>${esc(p?p.n:ns[j])}</span>${p?typeBadge(p):''}</div>`}).join('')}</div>`;
    h+=`<div class="card hcard"><div class="hh"><b>Court ${x.c}</b><span>${fmtTime(x.d)} · ${mins} min</span></div>
      <div class="hteams">${team(x.a,x.an,x.w==='a',x.ta)}<div class="vs">vs</div>${team(x.b,x.bn,x.w==='b',x.tb)}</div>
      ${x.w&&(x.w==='a'?x.ta:x.tb)?`<div class="hwin">🏆 Winning team: <b>${esc(x.w==='a'?x.ta:x.tb)}</b></div>`:''}
      ${x.sc?`<div class="hscore">Score: <b>${esc(x.sc)}</b></div>`:''}
      <div class="hf">${x.w?'':'<span class="hint" style="margin:0">No result recorded</span>'}<span class="grow"></span><button class="btn sm" data-act="h-win" data-id="${x.d}">Change winner</button><button class="btn sm warn" data-act="h-del" data-id="${x.d}">${confirmKey==='hd'+x.d?'Delete?':'✕'}</button></div></div>`;
  });
  return h;
}

/* ---------- events ---------- */
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;confirmKey=null;render();window.scrollTo(0,0);});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id, ci=el.dataset.c!==undefined?+el.dataset.c:null, k=el.dataset.k;
  if(IS_COURT&&!COURT_OK.has(a)) return;
  if(IS_DISPLAY&&!VIEW_OK.has(a)){ toast('Display tablet — make changes on the Main tablet'); return; }
  if(!['del','reset','wipe','h-del','h-clear','sc-reset','ph-del','team-del'].includes(a)) confirmKey=null;
  switch(a){
    case 'go': tab=el.dataset.tab; render(); break;
    case 'fill-all': fillAll(); break;
    case 'gen': if(fillCourt(ci)){save();render();} break;
    case 'finish':{ const sc=S.courts[ci].sc, w=scLeader(sc); if(sc&&sc.done==='d'){ const sum=scSummary(sc); finish(ci,true,''); toast('🤝 Draw · '+sum); break; } if(w){ const who=scWho(sc,w), sum=scSummary(sc); finish(ci,true,w); toast(who+' win · '+sum); break; } sheetWinner(ci); break;}
    case 'score': scoreOpen=ci; renderScore(); break;
    case 'sc-close': teamPick=null; scoreOpen=null; renderScore(); render(); break;
    case 'sc-pt': scPoint(scoreOpen,k); break;
    case 'sc-undo': scUndo(scoreOpen); break;
    case 'sc-serve': scServe(scoreOpen,k); break;
    case 'sc-swap': scSwap(scoreOpen,k); break;
    case 'sc-save':{ const i=scoreOpen, sc=S.courts[i].sc; if(!sc||!sc.done) break; if(sc.done==='d'){ const sum=scSummary(sc); scoreOpen=null; renderScore(); finish(i,true,''); toast('🤝 Draw · '+sum); break; } const sum=scSummary(sc), who=scWho(sc,sc.done); scoreOpen=null; renderScore(); finish(i,true,sc.done); toast('🏆 '+who+' win · '+sum); break;}
    case 'sc-reset':{ if(confirmKey!=='screset'){confirmKey='screset';renderScore();break;} confirmKey=null; const oldSeq=(S.courts[scoreOpen].sc&&S.courts[scoreOpen].sc.seq)||0; S.courts[scoreOpen].sc=null; scEnsure(scoreOpen).seq=oldSeq+1; scEnsure(scoreOpen); save(); renderScore(); break;}
    case 'win': closeSheet(); finish(ci,true,k==='x'?'':k); toast(k==='x'?'Game saved (no result)':'Result saved'); break;
    case 'h-f': histCourt=k; render(); break;
    case 'h-r': histRange=k; render(); break;
    case 'h-v': histView=k; render(); break;
    case 'h-del':{ const i=S.hist.findIndex(x=>String(x.d)===id); if(i<0)break;
      if(confirmKey!=='hd'+id){confirmKey='hd'+id;render();break;} confirmKey=null; S.hist.splice(i,1); save(); render(); break;}
    case 'h-win':{ const x=S.hist.find(x=>String(x.d)===id); if(x){ x.w=x.w==='a'?'b':x.w==='b'?'':'a'; save(); render(); } break;}
    case 'h-clear': if(confirmKey!=='hclear'){confirmKey='hclear';render();break;} confirmKey=null; S.hist=[]; save(); render(); toast('History cleared'); break;
    case 'cancel': finish(ci,false); break;

let xlsxLoading=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(!xlsxLoading) xlsxLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src=IS_APP?'file:///android_asset/xlsx.full.min.js':'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>{xlsxLoading=null;rej();};document.head.appendChild(s);});

function parseCat(v){
  const s=String(v==null?'':v).trim().toUpperCase().replace(/^(CAT(EGORY)?|LEVEL|GRADE|CLASS)\s*/,'');
  if(CATS.includes(s)) return s;
  const n={'1':'A','2':'B','3':'C','4':'D'}[s]; return n||null;
}
function importRows(rows){
  rows=rows.map(r=>(r||[]).map(x=>x==null?'':String(x).trim())).filter(r=>r.some(x=>x));
  if(!rows.length) return toast('The file looks empty');
  let nameCol=0, catCol=-1, start=0;
  const head=rows[0].map(x=>x.toLowerCase());
  const ni=head.findIndex(x=>/name|player/.test(x));
  const ci=head.findIndex(x=>/cat|level|skill|grade|class|group|rank/.test(x));
  const ti=head.findIndex(x=>/type|member|status|guest|subscri/.test(x));
  const tmi=head.findIndex(x=>/team|squad|club/.test(x));
  if(ni>=0||ci>=0||ti>=0||tmi>=0){ start=1; if(ni>=0) nameCol=ni; if(ci>=0) catCol=ci; }
  if(catCol<0){ // guess: the column whose values are mostly A-D
    const w=Math.max(...rows.map(r=>r.length)); let best=-1,bs=0;
    for(let c=0;c<w;c++){ if(c===nameCol) continue; const sc=rows.slice(start).filter(r=>parseCat(r[c])).length; if(sc>bs){bs=sc;best=c;} }
    catCol=best;
  }
  const idx={}; S.players.forEach(p=>idx[p.n.toLowerCase()]=p);
  let added=0, updated=0, noCat=0;
  rows.slice(start).forEach(r=>{
    const name=(r[nameCol]||'').slice(0,40); if(!name) return;
    let c=catCol>=0?parseCat(r[catCol]):null; if(!c){c='C';noCat++;}
    const tv=ti>=0?String(r[ti]||'').trim():''; const t=/^g/i.test(tv)?'G':(/^(s|m)/i.test(tv)?'S':null);
    const ex=idx[name.toLowerCase()];
    const tm=tmi>=0?String(r[tmi]||'').trim().slice(0,40):null;
    if(ex){ let ch=false; if(ex.c!==c){ex.c=c;ch=true;} if(t&&ex.t!==t){ex.t=t;ch=true;} if(tm!==null&&tm&&ex.tm!==tm){ex.tm=tm;ch=true;} if(ch) updated++; }
    else { const p={id:uid(),n:name,c,t:t||'S',tm:tm||''}; S.players.push(p); idx[name.toLowerCase()]=p; added++; }
  });
  save(); render();
  toast(`Imported: ${added} added${updated?', '+updated+' updated':''}${noCat?' · '+noCat+' had no category (set to C)':''}`);
}
async function importFile(f){
  toast('Reading '+f.name+'…');
  try{
    if(/\.csv$/i.test(f.name)){
      const t=await f.text();
      const sep=t.includes('\t')?'\t':(t.split(';').length>t.split(',').length?';':',');
      return importRows(t.split(/\r?\n/).map(l=>l.split(sep).map(x=>x.replace(/^"|"$/g,''))));
    }
    await loadXLSX();
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    importRows(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));
    const tsn=wb.SheetNames.find((n,i)=>i>0&&/^teams?$/i.test(n.trim()));
    if(tsn){ const rows=XLSX.utils.sheet_to_json(wb.Sheets[tsn],{header:1,raw:false,defval:''}); let added=0;
      rows.forEach((r,i)=>{ const v=String(r[0]||'').trim().slice(0,40); if(!v||(i===0&&/^(team|teams|team name)$/i.test(v))) return; if(!(S.teams||[]).some(x=>x.toLowerCase()===v.toLowerCase())){ S.teams=(S.teams||[]).concat(v); added++; } });
      if(added){ save(); render(); setTimeout(()=>toast(added+' custom team'+(added>1?'s':'')+' added from the Teams sheet'),2300); } }
  }catch(err){ toast('Could not read that file — try saving it as .xlsx or .csv'); }
  const fi=document.getElementById('file-in'); if(fi) fi.value='';
}

async function fetchPhotos(rev){
  lastPhRev=rev;
  try{ const r=await fetch('http://'+MAIN_IP+':8787/photos?t='+Date.now(),{cache:'no-store'}); if(r.ok){ PH=await r.json()||{}; try{localStorage.setItem(PH_KEY,JSON.stringify(PH));}catch(e){} render(); } else lastPhRev=-1; }catch(e){ lastPhRev=-1; }
}
function shareState(){ if(IS_COURT){ postScore(); return; } if(ROLE==='main'&&CAN_SYNC){ try{ AndroidApp.setShared(JSON.stringify(S)); }catch(e){} } }
function syncStatusText(){
  if(ROLE==='main'){ let n=0; try{ n=AndroidApp.clientCount(); }catch(e){} return (AndroidApp.serverRunning()?'Sharing':'Not sharing — switch Off and back to Main')+' · '+n+' display'+(n===1?'':'s')+' connected'; }
  if(ROLE==='display'){ if(!MAIN_IP) return 'Enter the address shown on the Main tablet.'; if(syncOk&&Date.now()-syncOk<6000) return 'Live from '+MAIN_IP+' · updated '+Math.max(0,Math.round((Date.now()-syncOk)/1000))+'s ago'; return 'Can\'t reach '+MAIN_IP+' — check both are on the same hotspot/Wi-Fi'+(syncOk?' · showing last data':''); }
  return '';
}
function syncHeader(){
  if(ROLE==='main') setSync(true,'Main · sharing');
  else if(ROLE==='court') setSync(!!(syncOk&&Date.now()-syncOk<6000),'Court '+(COURT_NO+1));
  else if(ROLE==='display') setSync(!!(syncOk&&Date.now()-syncOk<6000),syncOk&&Date.now()-syncOk<6000?'Display · live':'Display · offline');
  else setSync(true,'Saved on this tablet');
  const st=document.getElementById('syncstat'); if(st) st.textContent=syncStatusText();
}
async function pollMain(){
  clearTimeout(pollTimer);
  if(ROLE!=='display'&&ROLE!=='court') return;
  if(MAIN_IP){
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),3500);
    try{
      const r=await fetch('http://'+MAIN_IP+':8787/state?t='+Date.now(),{cache:'no-store',signal:ctl.signal});
      const txt=await r.text();
      if(r.ok){ syncOk=Date.now(); syncFails=0; if(IS_COURT&&postPending) postScore();
        if(txt!==lastTxt){ lastTxt=txt; const d=JSON.parse(txt); if(d&&Array.isArray(d.players)){ const mine=IS_COURT&&S.courts[COURT_NO]?S.courts[COURT_NO]:null; S=normalize(d); if(IS_COURT) mergeMine(mine); if(S.phRev!==lastPhRev) fetchPhotos(S.phRev); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} if(IS_COURT){ const key=courtKey(); if(key!==lastCourtKey){ lastCourtKey=key; render(); } } else if(!document.querySelector('input:focus')) render(); } }
      }
    }catch(e){ syncFails++; }
    clearTimeout(to);
  }
  syncHeader();
  pollTimer=setTimeout(pollMain, syncFails>3?4000:1500);
}
/* ---------- court tablets ---------- */
let courtExit=false, courtSetup=false, postPending=false, lastCourtKey='', posting=false;
const COURT_OK=new Set(['sc-topen','sc-tcancel','sc-tpick','sc-tuse','sc-tclear','sc-help','sc-pt','sc-undo','sc-serve','sc-swap','sc-reset','court-exit','court-exit-no','court-exit-ok']);
const sameSet=(x,y)=>Array.isArray(x)&&Array.isArray(y)&&x.length===y.length&&x.every(v=>y.includes(v));
function courtKey(){ const c=S.courts[COURT_NO]; return JSON.stringify([c&&c.p,c&&c.sc&&c.sc.seq,S.phRev]); }
function mergeMine(mine){
  const c=S.courts[COURT_NO];
  if(!mine||!mine.sc||!c||!sameSet(c.p,mine.p)) return;
  if(!c.sc||(mine.sc.seq||0)>(c.sc.seq||0)){ c.sc=mine.sc; postPending=true; }
}
async function postScore(){
  const c=S.courts[COURT_NO]; if(!c||!c.sc||!MAIN_IP) return;
  if(posting){ postPending=true; return; }
  posting=true; postPending=false;
  try{ const r=await fetch('http://'+MAIN_IP+':8787/score',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({c:COURT_NO,p:c.p,sc:c.sc})}); if(!r.ok) postPending=true; }
  catch(e){ postPending=true; }
  posting=false;
  if(postPending) setTimeout(postScore,1000);
}
function applyIncoming(){
  if(ROLE!=='main'||typeof AndroidApp.takeIncoming!=='function') return;
  let changed=false, msg;
  for(let n=0;n<50&&(msg=AndroidApp.takeIncoming());n++){
    try{
      const x=JSON.parse(msg), ct=S.courts[x.c];
      if(!ct||!x.sc||!x.sc.pos||!sameSet(ct.p,x.p)) continue;
      if(!ct.sc||(+x.sc.seq||0)>(+ct.sc.seq||0)){ ct.sc=x.sc; changed=true; }
    }catch(e){}
  }
  if(changed){ save(); render(); }
}
const VIEW_OK=new Set(['sc-help','go','ci-f','pl-f','h-f','h-r','h-v','pay-f','score','sc-close','sync-role','sync-ip','upd-check','upd-go','export','copypay','copy']);
if(IS_DISPLAY) document.body.classList.add('display');
if(IS_APP){
  if(ROLE==='main'){ try{ AndroidApp.startServer(); }catch(e){} shareState(); sharePhotos(); setInterval(applyIncoming,400); setInterval(syncHeader,3000); }
  if(ROLE==='display'||ROLE==='court'){ pollMain(); }
  if(IS_COURT){ document.body.classList.add('courtmode'); render(); }
  syncHeader(); setTimeout(()=>checkUpdate(false),1200); setInterval(()=>checkUpdate(false),IS_COURT?3*60*1000:15*60*1000);
}

render();
})();
</script>
